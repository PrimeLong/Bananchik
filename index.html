// ---------- Эффекты ----------
const FX = [];
function fxRing(x, y, r0, r1, col, life = 1, w = 2) { FX.push({ k: 'ring', x, y, r0, r1, col, life, max: life, w }); }
function fxSparks(x, y, n, col, spd = 40, life = 1) {
  for (let i = 0; i < n; i++) { const a = rand(TAU), s = rand(0.2, 1) * spd; FX.push({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, col, life: rand(0.4, 1) * life, max: life, size: rand(0.8, 2) }); }
}
function updateDrawFx(rdt) {
  const s = scale();
  for (let i = FX.length - 1; i >= 0; i--) {
    const f = FX[i];
    if (f.delay > 0) { f.delay -= rdt; continue; }
    f.life -= rdt; if (f.life <= 0) { FX.splice(i, 1); continue; }
    const k = f.life / f.max;
    if (f.k === 'spark' || f.k === 'glint') { f.x += f.vx * rdt; f.y += f.vy * rdt; f.vx *= 0.98; f.vy *= 0.98; }
    if (f.k === 'meteor') {
      f.sx += f.vx * rdt; f.sy += f.vy * rdt;
      const gr = ctx.createLinearGradient(f.sx, f.sy, f.sx - f.vx * 0.15, f.sy - f.vy * 0.15);
      gr.addColorStop(0, `rgba(255,255,255,${0.9 * k})`); gr.addColorStop(1, 'rgba(180,200,255,0)');
      ctx.strokeStyle = gr; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(f.sx, f.sy); ctx.lineTo(f.sx - f.vx * 0.15, f.sy - f.vy * 0.15); ctx.stroke();
      continue;
    }
    const [x, y] = w2s(f.x, f.y);
    if (f.k === 'ring') {
      const r = lerp(f.r1, f.r0, k) * s;
      ctx.strokeStyle = rgba(f.col, 0.7 * k); ctx.lineWidth = f.w * k + 0.5; ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r), 0, TAU); ctx.stroke();
    } else if (f.k === 'spark') {
      ctx.fillStyle = rgba(f.col, k); ctx.fillRect(x - f.size / 2, y - f.size / 2, f.size, f.size);
    } else if (f.k === 'glint') {
      glow(x, y, 8, [255, 210, 122], k * 0.9);
      ctx.fillStyle = `rgba(255,235,180,${k})`; ctx.fillRect(x - 1, y - 1, 2, 2);
    } else if (f.k === 'text') {
      f.y -= 12 * rdt / s;
      ctx.fillStyle = rgba(f.col, k); ctx.font = '600 12px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText(f.text, x, y);
    }
  }
}

// ---------- Главная отрисовка ----------
function render(rdt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (Game.view === 'galaxy') { renderGalaxy(rdt); return; }
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(bgCanvas, 0, 0, VW, VH);
  const t = Game.realT, s = scale();
  // Параллакс-звёзды
  ctx.globalCompositeOperation = 'lighter';
  for (const p of pStars) {
    const x = mod(p.x * VW - cam.x * s * p.z, VW), y = mod(p.y * VH - cam.y * s * p.z, VH);
    const a = 0.35 + 0.35 * Math.sin(t * p.sp + p.tw);
    ctx.fillStyle = `rgba(200,215,255,${a})`; ctx.fillRect(x, y, p.s, p.s);
  }
  if (!W) return;
  // Туманности поэтичных планет
  for (const n of W.nebulae) {
    const [x, y] = w2s(n.x, n.y), k = Math.sin(Math.PI * (1 - n.t / n.max));
    for (let i = 0; i < 3; i++) {
      const rr = (160 + i * 70) * s, gx = x + Math.cos(t * 0.2 + i * 2) * 30 * s, gy = y + Math.sin(t * 0.15 + i) * 30 * s;
      const rg = ctx.createRadialGradient(gx, gy, 0, gx, gy, rr);
      rg.addColorStop(0, `hsla(${n.hue + i * 35},80%,60%,${0.16 * k})`); rg.addColorStop(1, 'hsla(0,0%,0%,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(gx, gy, rr, 0, TAU); ctx.fill();
    }
  }
  // Сияние (аврора) — мягкая подсветка экрана
  if (W.auroraT > 0) {
    const k = Math.min(1, W.auroraT / 2) * 0.08;
    const rg = ctx.createLinearGradient(0, 0, VW, VH);
    rg.addColorStop(0, `rgba(80,255,180,${k})`); rg.addColorStop(0.5, `rgba(120,140,255,${k * 0.6})`); rg.addColorStop(1, `rgba(255,120,220,${k})`);
    ctx.fillStyle = rg; ctx.fillRect(0, 0, VW, VH);
  }
  ctx.globalCompositeOperation = 'source-over';
  if (W.disease) drawDiseaseAura(W.disease, t);
  // Связи ласковой стабилизации
  ctx.globalCompositeOperation = 'lighter';
  for (const b of W.bodies) if (b.calm && W.map.get(b.calmBy)) {
    const g = W.map.get(b.calmBy); const [x1, y1] = w2s(b.x, b.y), [x2, y2] = w2s(g.x, g.y);
    ctx.strokeStyle = `rgba(255,154,213,${0.12 + 0.06 * Math.sin(t * 2 + b.id)})`; ctx.lineWidth = 1;
    ctx.setLineDash([2, 6]); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
  }
  if (S.settings.orbits) drawOrbits();
  if (S.settings.trails) drawTrails();
  // Астероиды
  ctx.fillStyle = 'rgba(215,195,170,0.85)';
  for (const p of W.particles) {
    const [x, y] = w2s(p.x, p.y);
    if (x < -5 || y < -5 || x > VW + 5 || y > VH + 5) continue;
    const sz = 1.2 + 0.5 * Math.sin(t * 3 + p.tw);
    ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
  }
  // Тела: сначала свечение, потом сами тела
  for (const b of W.bodies) drawBodyGlow(b, t);
  ctx.globalCompositeOperation = 'source-over';
  for (const b of W.bodies) drawBody(b, t);
  if (W.disease) drawDisease(W.disease, t);
  ctx.globalCompositeOperation = 'lighter';
  updateDrawFx(rdt);
  ctx.globalCompositeOperation = 'source-over';
  drawLabels(t);
  drawInputPreview(t);
  // Переход консервации: вспышка и схлопывание в звезду
  if (Game.transition) {
    const T = Game.transition; T.t += rdt; const k = clamp(T.t / T.dur, 0, 1);
    cam.zoom *= Math.exp(-rdt * 0.9);
    const [x, y] = w2s(0, 0);
    ctx.globalCompositeOperation = 'lighter';
    glow(x, y, (40 + k * k * Math.max(VW, VH) * 1.3), [255, 230, 190], k * 1.2);
    ctx.globalCompositeOperation = 'source-over';
    if (k > 0.75) { ctx.fillStyle = `rgba(255,250,240,${(k - 0.75) * 4})`; ctx.fillRect(0, 0, VW, VH); }
    if (T.t >= T.dur) { Game.transition = null; T.onEnd(); }
  }
  // Виньетка
  const vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, W.disease ? 'rgba(40,0,30,0.55)' : 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
}

// Кеплеровы эллипсы орбит по текущим орбитальным элементам
function drawOrbits() {
  const s = scale(); ctx.lineWidth = 1;
  for (const b of W.bodies) {
    if (!b.P || !b.bound || b.evx === undefined || b.e > 0.97 || b.type === 'shard' || b.type === 'rogue' || !isFinite(b.a) || b.a > 4000 || b.a * s < 4) continue;
    const fx = b.P.x + (b.ocdx || 0), fy = b.P.y + (b.ocdy || 0), ang = Math.atan2(b.evy, b.evx), e = b.e, a = b.a;
    const [cx, cy] = w2s(fx - a * e * Math.cos(ang), fy - a * e * Math.sin(ang));
    const hl = UI.hover === b || UI.sel === b;
    ctx.strokeStyle = rgba(b.chaos > 0.5 ? [255, 92, 122] : trailColor(b), hl ? 0.5 : 0.12);
    ctx.beginPath(); ctx.ellipse(cx, cy, a * s, a * Math.sqrt(1 - e * e) * s, ang, 0, TAU); ctx.stroke();
  }
}
function trailColor(b) { return b.pers ? PERS[b.pers].rgb : b.col; }
function drawTrails() {
  ctx.lineCap = 'round';
  for (const b of W.bodies) {
    const tr = b.trail, n = tr.length / 2; if (n < 2) continue;
    const c = trailColor(b), chunks = 6, per = Math.ceil(n / chunks);
    ctx.lineWidth = b.type === 'comet' ? 1.6 : 1.2;
    for (let ci = 0; ci < chunks; ci++) {
      const i0 = ci * per, i1 = Math.min(n - 1, (ci + 1) * per); if (i1 <= i0) continue;
      ctx.strokeStyle = rgba(c, 0.05 + 0.3 * (ci + 1) / chunks);
      ctx.beginPath();
      for (let i = i0; i <= i1; i++) { const [x, y] = w2s(tr[i * 2], tr[i * 2 + 1]); i === i0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      if (ci === chunks - 1) { const [x, y] = w2s(b.x, b.y); ctx.lineTo(x, y); }
      ctx.stroke();
    }
  }
}

function onScreen(x, y, r) { return x > -r && y > -r && x < VW + r && y < VH + r; }

// Свечение тела и ауры характеров (режим lighter)
function drawBodyGlow(b, t) {
  const [x, y] = w2s(b.x, b.y), s = scale(), R = Math.max(1.6, b.r * s);
  if (!onScreen(x, y, R * 12)) return;
  const fl = b.flash || 0;
  if (b.type === 'sun') {
    glow(x, y, R * 9, [255, 170, 80], 0.45); glow(x, y, R * 3.5, [255, 220, 150], 0.9);
    // корональные лучи
    ctx.save(); ctx.translate(x, y);
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * TAU + t * 0.05, L = R * (1.8 + 0.5 * Math.sin(t * 0.7 + i * 1.7));
      const gr = ctx.createLinearGradient(0, 0, Math.cos(a) * L, Math.sin(a) * L);
      gr.addColorStop(0, 'rgba(255,210,140,0.35)'); gr.addColorStop(1, 'rgba(255,160,80,0)');
      ctx.strokeStyle = gr; ctx.lineWidth = R * 0.25; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * L, Math.sin(a) * L); ctx.stroke();
    }
    ctx.restore();
  } else if (b.type === 'rogue') {
    const f = 1 + 0.1 * Math.sin(t * 4 + b.seed);
    glow(x, y, R * 9 * f, [255, 70, 50], 0.5); glow(x, y, R * 3, [255, 170, 140], 0.9);
  } else if (b.type === 'dwarf') {
    const f = 1 + 0.08 * Math.sin(t * 5 + b.seed) + 0.05 * Math.sin(t * 13 + b.seed);
    glow(x, y, R * 7 * f, [255, 120, 60], 0.5); glow(x, y, R * 2.8, [255, 200, 140], 0.85);
  } else if (b.type === 'neutron') {
    glow(x, y, R * 10, [120, 170, 255], 0.55); glow(x, y, R * 3, [220, 235, 255], 1);
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * 3 + b.seed);
    for (const sgn of [1, -1]) {
      const L = R * 22, gr = ctx.createLinearGradient(0, 0, sgn * L, 0);
      gr.addColorStop(0, 'rgba(200,225,255,0.55)'); gr.addColorStop(1, 'rgba(120,160,255,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(sgn * L, -R * 2); ctx.lineTo(sgn * L, R * 2); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  } else if (b.type === 'comet') {
    // хвост направлен от звезды
    const L = clamp(9000 / Math.max(60, b.starD), 10, 90) * s, ang = Math.atan2(-b.ly, -b.lx);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    let gr = ctx.createLinearGradient(0, 0, L, 0); gr.addColorStop(0, 'rgba(170,230,255,0.6)'); gr.addColorStop(1, 'rgba(120,180,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(0, -R * 0.9); ctx.lineTo(L, -R * 0.3); ctx.lineTo(L, R * 0.3); ctx.lineTo(0, R * 0.9); ctx.fill();
    gr = ctx.createLinearGradient(0, 0, L * 0.7, 0); gr.addColorStop(0, 'rgba(255,240,210,0.45)'); gr.addColorStop(1, 'rgba(255,220,180,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(0, -R); ctx.quadraticCurveTo(L * 0.4, R * 0.5, L * 0.7, R * 2.6); ctx.lineTo(L * 0.6, R * 3.2); ctx.quadraticCurveTo(L * 0.3, R * 1.5, 0, R); ctx.fill();
    ctx.restore();
    glow(x, y, R * 4, [190, 235, 255], 0.8);
  } else {
    glow(x, y, R * 2.6, b.col, 0.28 + fl * 0.5);
  }
  if (fl > 0 && isStar(b)) glow(x, y, R * 6, [255, 255, 255], fl * 0.6);
  // Ауры характеров
  const P = b.pers;
  if (P === 'gentle') {
    const br = 0.5 + 0.5 * Math.sin(t * 1.8 + b.seed);
    glow(x, y, R * (3.2 + br * 0.8), PERS.gentle.rgb, 0.22 + br * 0.12);
    ctx.strokeStyle = `rgba(255,154,213,${0.2 + 0.2 * br})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(x, y, R * (1.7 + 0.2 * br) + 3, 0, TAU); ctx.stroke();
  } else if (P === 'greedy') {
    ctx.save(); ctx.translate(x, y);
    for (let k = 0; k < 3; k++) {
      const a0 = -t * 1.6 + k * TAU / 3; ctx.beginPath();
      for (let i = 0; i <= 14; i++) { const u = i / 14, rr = R * (2.8 - 1.5 * u) + 3, a = a0 + u * 2.2; const px = Math.cos(a) * rr, py = Math.sin(a) * rr; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.strokeStyle = 'rgba(167,123,255,0.4)'; ctx.lineWidth = 1.3; ctx.stroke();
    }
    ctx.restore();
    glow(x, y, R * 2.5, [120, 70, 220], 0.25);
  } else if (P === 'shy') {
    if (b.shyNear) { ctx.strokeStyle = `rgba(143,233,255,${0.3 + 0.3 * Math.sin(t * 12)})`; ctx.setLineDash([2, 4]); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, R + 8, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    glow(x, y, R * 2.4, PERS.shy.rgb, 0.12 + 0.08 * Math.sin(t * 4 + b.seed));
  } else if (P === 'poetic') {
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = `hsla(${(t * 40 + b.seed) % 360},90%,72%,0.55)`; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.ellipse(0, 0, R * 2.1 + 2, R * 0.75 + 1, b.tilt, 0, TAU); ctx.stroke();
    for (let k = 0; k < 3; k++) {
      const a = t * 1.2 + k * TAU / 3, px = Math.cos(a) * (R * 2.3 + 4), py = Math.sin(a) * (R * 2.3 + 4);
      ctx.fillStyle = `hsla(${(t * 60 + k * 120) % 360},100%,80%,0.9)`; ctx.fillRect(px - 1, py - 1, 2, 2);
    }
    ctx.restore();
    if (b.aurora > 0) {
      for (let k = 0; k < 3; k++) { ctx.strokeStyle = `hsla(${140 + k * 50 + Math.sin(t) * 20},90%,65%,${0.25 * Math.min(1, b.aurora / 2)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, R * (3 + k * 0.8) + Math.sin(t * 2 + k) * 3, 0, TAU); ctx.stroke(); }
    }
  } else if (P === 'capricious' && Math.random() < 0.03) {
    FX.push({ k: 'spark', x: b.x + rand(-b.r, b.r), y: b.y + rand(-b.r, b.r), vx: rand(-15, 15), vy: rand(-15, 15), col: PERS.capricious.rgb, life: 0.6, max: 0.6, size: 1.4 });
  }
}

// Форма тела (капризные «дрожат», осколки неровные)
function bodyPath(b, R, t) {
  ctx.beginPath();
  if (b.pers === 'capricious' || b.type === 'shard') {
    const n = 18;
    for (let i = 0; i <= n; i++) {
      const a = i / n * TAU;
      const w = b.type === 'shard' ? 1 + 0.25 * Math.sin(a * 3 + b.seed) + 0.12 * Math.sin(a * 5 + b.seed * 2)
        : 1 + 0.07 * Math.sin(a * 3 + t * 4 + b.seed) + 0.05 * Math.sin(a * 5 - t * 3);
      const px = Math.cos(a) * R * w, py = Math.sin(a) * R * w; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  } else ctx.arc(0, 0, R, 0, TAU);
}
function shade(c, k) { return [clamp(Math.round(c[0] * k), 0, 255), clamp(Math.round(c[1] * k), 0, 255), clamp(Math.round(c[2] * k), 0, 255)]; }

function drawBody(b, t) {
  const [x, y] = w2s(b.x, b.y), s = scale(), R = Math.max(1.6, b.r * s);
  if (!onScreen(x, y, R * 3)) return;
  ctx.save(); ctx.translate(x, y);
  if (b.pers === 'shy') ctx.globalAlpha = 0.72 + 0.18 * Math.sin(t * 3 + b.seed);
  const c = b.col;
  if (isStar(b)) {
    const core = b.type === 'neutron' ? ['#ffffff', '#e8f2ff', '#9cc4ff'] : b.type === 'dwarf' ? ['#fff7e0', '#ffb45e', '#e0502a'] : b.type === 'rogue' ? ['#ffe6dc', '#ff7a5a', '#a8201a'] : ['#fffbe8', '#ffd98a', '#ff9a3c'];
    const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    gr.addColorStop(0, core[0]); gr.addColorStop(0.55, core[1]); gr.addColorStop(1, core[2]);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
    if (b.type !== 'neutron' && R > 6) { // грануляция поверхности
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 5; i++) { const a = b.seed + i * 1.3 + t * 0.1, rr = R * 0.5 * ((i * 0.37 + 0.2) % 1); ctx.fillStyle = 'rgba(255,240,200,0.12)'; ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, R * 0.3, 0, TAU); ctx.fill(); }
    }
    ctx.restore(); return;
  }
  // Планеты: освещение со стороны звезды
  const lx = b.lx * R * 0.4, ly = b.ly * R * 0.4;
  const gr = ctx.createRadialGradient(lx, ly, R * 0.1, 0, 0, R * 1.25);
  gr.addColorStop(0, rgba(shade(c, 1.45), 1)); gr.addColorStop(0.5, rgba(c, 1)); gr.addColorStop(1, rgba(shade(c, 0.35), 1));
  bodyPath(b, R, t); ctx.fillStyle = gr; ctx.fill();
  if (R > 3.5) {
    ctx.save(); bodyPath(b, R, t); ctx.clip();
    if (b.type === 'rock' || b.type === 'moon' || b.type === 'shard') {
      for (let k = 0; k < (b.type === 'moon' ? 2 : 3); k++) {
        const a = b.seed * (k + 1) * 1.7, rr = R * (0.25 + 0.3 * ((b.seed * (k + 3)) % 1)), cr = R * (0.15 + 0.1 * ((b.seed * (k + 7)) % 1));
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, cr, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, cr, Math.PI, Math.PI * 1.6); ctx.stroke();
      }
    } else if (b.type === 'ocean') {
      for (let k = 0; k < 3; k++) {
        const px = mod(b.seed * 37 * (k + 1) + t * R * 0.18, R * 3) - R * 1.5, py = Math.sin(b.seed + k * 2.1) * R * 0.5;
        ctx.fillStyle = 'rgba(95,185,115,0.75)'; ctx.beginPath(); ctx.ellipse(px, py, R * 0.38, R * 0.22, k, 0, TAU); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(1, R * 0.08);
      for (let k = 0; k < 2; k++) { const px = mod(b.seed * 11 * (k + 2) + t * R * 0.3, R * 3) - R * 1.5; ctx.beginPath(); ctx.arc(px, (k - 0.5) * R * 0.8, R * 0.5, 0.2, 1.6); ctx.stroke(); }
    } else if (b.type === 'gas') {
      ctx.rotate(b.tilt * 0.25);
      for (let i = -5; i <= 5; i++) {
        const h = R * (0.12 + 0.05 * Math.sin(i * 1.7 + b.seed));
        ctx.fillStyle = rgba(i % 2 ? shade(c, 1.25) : shade(c, 0.72), 0.45);
        ctx.fillRect(-R * 1.2, i * R * 0.2 - h / 2 + Math.sin(t * 0.5 + i) * R * 0.02, R * 2.4, h);
      }
      const sx = mod(b.seed * 13 + t * R * 0.12, R * 2.6) - R * 1.3;
      ctx.fillStyle = 'rgba(190,80,50,0.55)'; ctx.beginPath(); ctx.ellipse(sx, R * 0.3, R * 0.22, R * 0.12, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
    // Ночная сторона
    const sh = ctx.createRadialGradient(lx * 1.4, ly * 1.4, R * 0.3, lx * 1.4, ly * 1.4, R * 1.9);
    sh.addColorStop(0, 'rgba(0,0,10,0)'); sh.addColorStop(0.55, 'rgba(0,0,10,0.05)'); sh.addColorStop(1, 'rgba(0,0,15,0.75)');
    bodyPath(b, R, t); ctx.fillStyle = sh; ctx.fill();
  }

function drawInputPreview(t) {

      if (d.pred) dashed(d.pred.pts, d.snapped ? [125, 255, 176] : T.col, d.pred.hit);
      ctx.font = '11px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = d.snapped ? 'rgba(125,255,176,0.95)' : 'rgba(220,228,255,0.8)';
      ctx.fillText(d.snapped ? 'круговая орбита ✓' : `скорость ${Math.round(Math.hypot(d.vx - d.attV[0], d.vy - d.attV[1]))}`, cx, cy - 12);

const GAL = { sel: null, size: 0, ox: 0, oy: 0 };

function showTip(b) {

  const [x, y] = w2s(b.x, b.y);
  const T = TYPES[b.type];
  let orbit = '';
  if (b.P) {
    const state = !b.bound ? 'уходит прочь' : b.chaos > 0.55 ? 'хаотичная' : b.chaos > 0.25 ? 'неспокойная' : 'стабильная';
    orbit = `<div class="ts">Орбита вокруг ${b.P.name}: ${state}${b.bound ? ` · e=${b.e.toFixed(2)} · период ${b.T < 1000 ? b.T.toFixed(1) + ' с' : '∞'}` : ''}</div>
      <div class="cb"><i style="width:${Math.round((1 - b.chaos) * 100)}%;background:hsl(${(1 - b.chaos) * 120},80%,55%)"></i></div>`;
  } else if (b.type === 'sun') orbit = '<div class="ts">Центр сада. Всё вращается вокруг него.</div>';
  const pers = b.pers ? `<div class="tp" style="color:${PERS[b.pers].col}">${PERS[b.pers].icon} ${persAdj(b)}</div><div class="td">${PERS[b.pers].desc}</div>` : (T.desc ? `<div class="td">${T.desc}</div>` : '');
  tip.innerHTML = `<div class="tn">${b.name}</div><div class="ts">${T.name} · масса ${b.m < 10 ? b.m.toFixed(1) : Math.round(b.m)}</div>${pers}${orbit}`;
  tip.classList.remove('hidden');

  if (where === 'galaxy') { openGalaxy(Game.gardenRef && Game.gardenRef.id); return; }
  const g = createGarden(); Game.gardenRef = g; Game.mode = 'garden'; afterWorldChange(); save();
  toast(`🌱 Новый сад: «${g.name}»`, 'gold');
}
function confirmReset() {
  const txt = Game.mode === 'garden' ? 'Все тела исчезнут, останется только Сердце. Пыль не вернётся' + (W.conserved ? ', а сад потеряет звезду в галактике.' : '.') : Game.mode === 'sandbox' ? 'Песочница будет очищена.' : 'Испытание начнётся заново.';
  openModal(`<h2>Сбросить?</h2><p>${txt}</p><div class="row"><button class="mb danger" data-act="reset-yes">Сбросить</button><button class="mb" data-act="close">Отмена</button></div>`);
}

// Кнопки верхней и нижней панели
$('#bMenu').onclick = () => { Audio.init(); Audio.click(); showMenu(); };
$('#bPause').onclick = () => { Audio.init(); Game.paused = !Game.paused; Audio.click(); uiUpdate(1, true); };
$('#bSpeed').onclick = () => { Audio.init(); const sp = [1, 2, 4, 8]; Game.speed = sp[(sp.indexOf(Game.speed) + 1) % sp.length]; Audio.click(); uiUpdate(1, true); };
$('#bReset').onclick = () => { Audio.init(); Audio.click(); confirmReset(); };
$('#bConserve').onclick = () => { Audio.init(); conserve(); };
$('#bGalaxy').onclick = () => { Audio.init(); Audio.click(); openGalaxy(); };
function takeShot() {
  try {
    const a = document.createElement('a');
    a.download = (W ? W.name : 'Гравитационный сад') + '.png'; a.href = cv.toDataURL('image/png'); a.click();
    toast('📷 Снимок сада сохранён'); Audio.click();
  } catch (e) { toast('Не удалось сделать снимок', 'bad'); }
}
$('#bShot').onclick = () => { Audio.init(); takeShot(); };
$('#bUpg').onclick = () => { Audio.init(); Audio.click(); showUpgrades(); };

// ---------- Посадка семян и толчки ----------
function placeSeed(type, x, y, vx, vy) {
  const T = TYPES[type];
  for (const b of W.bodies) if (Math.hypot(b.x - x, b.y - y) < b.r + T.r + 2) { toast('Слишком близко к другому телу', 'bad'); Audio.bad(); return false; }
  if (Game.mode === 'garden') {
    if (!S.unlocked[type]) { tryUnlock(type); return false; }
    if (S.dust < T.cost) { toast(`Не хватает пыли: нужно ${T.cost} ✦`, 'bad'); Audio.bad(); return false; }
    S.dust -= T.cost;
  }
  if (Game.mode === 'challenge') {
    const C = W.chal;
    if (C.used >= C.def.budget) { toast('Лимит тел в испытании исчерпан. Сбрось, чтобы начать заново.', 'bad'); Audio.bad(); return false; }
    C.used++;
  }
  const pers = T.pers ? S.nextPers : null;
  const b = makeBody(W, type, x, y, vx, vy, { pers });
  W.bodies.push(b); computeAcc(); analyze(0.01);
  if (pers) S.nextPers = rollPers();
  S.stats.planted++; unlockAch('first'); if (S.stats.planted >= 25) unlockAch('gardener');
  W.maxBodies = Math.max(W.maxBodies, W.bodies.length);
  const first = !W.events.some(e => e.k === 'plant');
  logEv(first ? `Первым миром сада ${vf(b, 'стала', 'стал')} ${descOf(b)} ${b.name}.` : `В саду ${vf(b, 'появилась', 'появился')} ${descOf(b)} ${b.name}.`, 'plant');
  fxRing(x, y, 1, T.r * 4, b.pers ? PERS[b.pers].rgb : T.col, 0.8, 2);
  Audio.place();
  if (!S.hintDone) { S.hintDone = true; uiUpdate(1, true); }
  if (b.pers) toast(`<span style="color:${PERS[b.pers].col}">${PERS[b.pers].icon} ${persAdj(b)}</span> ${b.name}`);
  return true;
}
function applyPush(b, dvx, dvy) {
  if (Game.mode === 'garden') { if (S.dust < 5) { toast('Толчок стоит 5 ✦', 'bad'); Audio.bad(); return; } S.dust -= 5; }
  if (Game.mode === 'challenge' && W.chal.def.pushes) {
    if (W.chal.pushes >= W.chal.def.pushes) { toast('Толчки закончились', 'bad'); Audio.bad(); return; }
    W.chal.pushes++; buildSeeds();
  }
  b.vx += dvx; b.vy += dvy; b.flash = 0.8;
  fxSparks(b.x, b.y, 14, [143, 180, 255], 40, 0.8); Audio.launch();
}

// ---------- Ввод: мышь, касания, щипок ----------
const pointers = new Map();
function bodyAt(sx, sy) {
  if (!W) return null;
  const s = scale(); let best = null, bd = 1e9;
  for (const b of W.bodies) {
    const [x, y] = w2s(b.x, b.y), d = Math.hypot(x - sx, y - sy), R = Math.max(10, b.r * s + 6);
    if (d < R && d < bd) { bd = d; best = b; }
  }
  return best;
}
function galaxyHit(sx, sy) {
  let best = null, bd = 28;
  for (const g of S.gardens) { const [x, y] = g2s(g.gx, g.gy), d = Math.hypot(x - sx, y - sy); if (d < bd) { bd = d; best = g; } }
  return best;
}
// Пересчёт состояния перетаскивания семени: скорость, «магнит» к круговой орбите, предсказание
function updateSeedDrag(d, cx, cy) {
  d.cx = cx; d.cy = cy;
  if (Math.hypot(cx - d.sx, cy - d.sy) > 9) d.moved = true;
  const T = TYPES[d.type];
  d.att = localAttractor(d.wx, d.wy, T.m);
  d.attV = d.att ? [d.att.vx, d.att.vy] : [0, 0];
  d.circ = d.att ? circularVelocity(d.wx, d.wy, T.m, d.att, d.type === 'comet' ? 0.55 : 1) : null;
  if (!d.moved) return;
  const [wx, wy] = s2w(cx, cy);
  let vx = d.attV[0] + (wx - d.wx) * LAUNCH_K, vy = d.attV[1] + (wy - d.wy) * LAUNCH_K;
  d.snapped = false;
  if (d.circ) {
    const rx = d.circ[0] - d.attV[0], ry = d.circ[1] - d.attV[1], mag = Math.hypot(rx, ry);
    if (Math.hypot(vx - d.circ[0], vy - d.circ[1]) < mag * 0.12) { vx = d.circ[0]; vy = d.circ[1]; d.snapped = true; }
  }
  d.vx = vx; d.vy = vy;
  d.pred = predictPath(d.wx, d.wy, vx, vy, T.m, T.r, -1);
}
function updatePushDrag(d, cx, cy) {
  d.cx = cx; d.cy = cy;
  if (Math.hypot(cx - d.sx, cy - d.sy) > 9) d.moved = true;
  if (!d.moved) return;
  const [wx, wy] = s2w(cx, cy), b = d.body;
  d.dvx = (wx - b.x) * LAUNCH_K * 0.5; d.dvy = (wy - b.y) * LAUNCH_K * 0.5;
  d.pred = predictPath(b.x, b.y, b.vx + d.dvx, b.vy + d.dvy, b.m, b.r, b.id);
}

cv.addEventListener('pointerdown', e => {
  Audio.init();
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (Game.transition || !W) return;
  if (pointers.size === 2) { // щипок
    const [p1, p2] = [...pointers.values()];
    UI.drag = { kind: 'pinch', d0: Math.hypot(p1.x - p2.x, p1.y - p2.y), zoom0: cam.zoom, mx: (p1.x + p2.x) / 2, my: (p1.y + p2.y) / 2, camx: cam.x, camy: cam.y };
    return;
  }
  const sx = e.clientX, sy = e.clientY;
  if (Game.view === 'galaxy') { UI.drag = { kind: 'gtap', sx, sy }; return; }
  if (W.dead) return;
  const hit = bodyAt(sx, sy);
  if (UI.tool === 'push' && hit) { UI.drag = { kind: 'push', body: hit, sx, sy, moved: false }; return; }
  if (TYPES[UI.tool] && !hit) {
    const [wx, wy] = s2w(sx, sy);
    UI.drag = { kind: 'seed', type: UI.tool, wx, wy, sx, sy, moved: false };
    updateSeedDrag(UI.drag, sx, sy);
    return;
  }
  UI.drag = { kind: 'pan', sx, sy, camx: cam.x, camy: cam.y, moved: false, hit };
});
cv.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (e.pointerType === 'mouse') UI.mouse = { x: e.clientX, y: e.clientY };
  const d = UI.drag;
  if (!d) {
    if (e.pointerType === 'mouse' && Game.view === 'garden') UI.hover = bodyAt(e.clientX, e.clientY);
    cv.style.cursor = Game.view === 'galaxy' ? (galaxyHit(e.clientX, e.clientY) ? 'pointer' : 'default') : UI.hover ? 'pointer' : TYPES[UI.tool] ? 'crosshair' : 'grab';
    return;
  }
  if (d.kind === 'pinch' && pointers.size >= 2) {
    const [p1, p2] = [...pointers.values()], dd = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    cam.zoom = clamp(d.zoom0 * dd / Math.max(10, d.d0), 0.2, 5);
    const s = scale(); cam.x = d.camx - ((p1.x + p2.x) / 2 - d.mx) / s; cam.y = d.camy - ((p1.y + p2.y) / 2 - d.my) / s;
  } else if (d.kind === 'seed') updateSeedDrag(d, e.clientX, e.clientY);
  else if (d.kind === 'push') updatePushDrag(d, e.clientX, e.clientY);
  else if (d.kind === 'pan') {
    if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 6) d.moved = true;
    if (d.moved) { const s = scale(); cam.x = d.camx - (e.clientX - d.sx) / s; cam.y = d.camy - (e.clientY - d.sy) / s; }
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  const d = UI.drag; if (!d) return;
  if (d.kind === 'pinch') { if (pointers.size === 0) UI.drag = null; return; }
  UI.drag = null;
  if (e.type === 'pointercancel') return;
  if (d.kind === 'gtap') { if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 10) { const g = galaxyHit(e.clientX, e.clientY); GAL.sel = g ? g.id : null; if (g) Audio.click(); galCard(); } return; }
  if (d.kind === 'seed') {
    updateSeedDrag(d, e.clientX, e.clientY);
    let vx, vy;
    if (d.moved) { vx = d.vx; vy = d.vy; }
    else if (d.circ) { vx = d.circ[0]; vy = d.circ[1]; } // касание: круговая орбита
    else { vx = 0; vy = 0; }
    if (placeSeed(d.type, d.wx, d.wy, vx, vy) && d.moved) Audio.launch();
  } else if (d.kind === 'push') {
    if (d.moved) applyPush(d.body, d.dvx, d.dvy); else { UI.sel = d.body; UI.selT = 4; }
  } else if (d.kind === 'pan' && !d.moved) {
    UI.sel = d.hit || null; UI.selT = d.hit ? 4 : 0;
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { UI.mouse = null; UI.hover = null; } });
cv.addEventListener('wheel', e => {
  e.preventDefault(); if (Game.view !== 'garden') return;
  const [bx, by] = s2w(e.clientX, e.clientY);
  cam.zoom = clamp(cam.zoom * Math.exp(-e.deltaY * 0.0015), 0.2, 5);
  const [ax, ay] = s2w(e.clientX, e.clientY); cam.x += bx - ax; cam.y += by - ay;
}, { passive: false });
cv.addEventListener('dblclick', () => { if (Game.view === 'garden') resetCamera(); });
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  Audio.init();
  if (e.key === 'Escape') { if (Game.modal && !Game.lockModal) closeModal(); else if (!Game.modal) { if (Game.view === 'galaxy') $('#bGalBack').onclick(); else showMenu(); } return; }
  if (Game.modal) return;
  if (e.code === 'Space') { e.preventDefault(); Game.paused = !Game.paused; uiUpdate(1, true); }
  else if (e.key === 'g' || e.key === 'G' || e.key === 'п' || e.key === 'П') { if (Game.mode !== 'challenge') { if (Game.view === 'galaxy') $('#bGalBack').onclick(); else openGalaxy(); } }
  else if (e.key === 'c' || e.key === 'с') resetCamera();
  else if (/^[1-7]$/.test(e.key) && Game.view === 'garden') {
    const list = SEED_ORDER.filter(t => Game.mode !== 'challenge' || W.chal.def.types.includes(t));
    const t = list[+e.key - 1]; if (t) selectTool(t);
  }
});

// ---------- Главный цикл ----------
let last = performance.now(), simAcc = 0;
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  Game.realT += rdt;
  try {
    if (W && Game.view === 'garden' && !Game.paused && !Game.modal && !W.dead && !Game.transition) {
      simAcc += rdt * Game.speed;
      let n = 0;
      while (simAcc >= DT && n < MAX_STEPS && !W.dead) { stepWorld(DT); simAcc -= DT; n++; }
      if (n >= MAX_STEPS) simAcc = 0;
      tickWorld(n * DT);
    }
    passiveTick(rdt);
    Audio.updateMusic();
    render(rdt);
    uiUpdate(rdt);
    // подсказка: наведение или выбранное касанием тело
    if (UI.selT > 0) UI.selT -= rdt; else UI.sel = null;
    UI.tipT -= rdt;
    if (UI.tipT <= 0) { UI.tipT = 0.12; const tb = UI.drag && UI.drag.kind !== 'pan' ? null : (UI.hover || UI.sel); if (tb && !Game.modal) showTip(tb); else hideTip(); }
    Game.saveT += rdt;
    if (Game.saveT > 5) { Game.saveT = 0; save(); }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}

// ---------- Запуск ----------
function init() {
  resize();
  window.addEventListener('resize', () => { resize(); uiUpdate(1, true); });
  // Пассивная пыль, накопленная галактикой, пока игрока не было (25%, максимум за 2 часа)
  const away = Math.min(7200, (Date.now() - (S.lastSeen || Date.now())) / 1000);
  enterGarden(S.activeId);
  const offline = passiveRate() * away * 0.25;
  if (offline >= 1) { S.dust += offline; setTimeout(() => toast(`✷ Пока тебя не было, галактика собрала ${Math.floor(offline)} ✦`, 'gold'), 800); }
  if (S.seenVersion !== VERSION) showNews(true); else showMenu(true);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('beforeunload', save);
  requestAnimationFrame(t => { last = t; frame(t); });
}
init();
</script>
