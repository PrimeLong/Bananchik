<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04050d">
<title>Гравитационный сад</title>
<style>
/* ===================== Базовые переменные и сброс ===================== */
:root{
  --bg:#04050d; --panel:rgba(14,18,42,.74); --panel2:rgba(24,30,66,.92);
  --line:rgba(140,160,255,.2); --text:#e8ebff; --dim:#9aa3d0;
  --gold:#ffd27a; --accent:#8fb4ff; --pink:#ff9ad5; --bad:#ff5c7a; --good:#7dffb0;
  --topH:64px; --bottomH:84px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;font-size:14px}
canvas#cv{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair}
button{font:inherit;color:inherit}
.hidden{display:none!important}

/* ===================== Панели ===================== */
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;gap:8px;padding:8px 10px;z-index:5;pointer-events:none}
.bar>*{pointer-events:auto}
#top{top:0;padding-top:max(8px,env(safe-area-inset-top));flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(4,5,13,.92),rgba(4,5,13,.55) 70%,rgba(4,5,13,0))}
#bottom{bottom:0;padding-bottom:max(8px,env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(4,5,13,.95),rgba(4,5,13,.6) 75%,rgba(4,5,13,0))}
.ib{height:38px;min-width:38px;padding:0 10px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;
  transition:background .2s,border-color .2s,transform .1s;position:relative;overflow:hidden}
.ib:hover{background:var(--panel2);border-color:rgba(160,180,255,.4)}
.ib:active{transform:scale(.95)}
.ib:disabled{opacity:.42;cursor:default}
.ib.on{border-color:var(--gold);box-shadow:0 0 12px rgba(255,210,122,.35)}
.ib.ready{border-color:var(--good);box-shadow:0 0 14px rgba(125,255,176,.45);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(125,255,176,.75)}}
.ib i.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--good);width:0;transition:width .3s}

.title{display:flex;flex-direction:column;line-height:1.15;min-width:0;max-width:220px}
.title #modeLbl{font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
.title #gName{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stab{flex:1 1 160px;min-width:140px;display:flex;flex-direction:column;gap:4px}
.stabLbl{font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
.stabLbl b{color:var(--text)}
.stabBar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid var(--line)}
#stabFill{height:100%;width:100%;border-radius:6px;transition:width .3s,background .3s}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;min-width:54px;text-align:center}
.btns{display:flex;gap:6px;margin-left:auto}

.dust{display:flex;flex-direction:column;align-items:flex-start;padding:4px 12px;border-radius:14px;
  background:var(--panel);border:1px solid rgba(255,210,122,.3);min-width:86px}
.dust b{font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums;transition:text-shadow .3s}
.dust b.bump{text-shadow:0 0 12px var(--gold)}
.dust small{color:var(--dim);font-size:11px;white-space:nowrap}
.seeds{flex:1;display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:thin;scrollbar-color:rgba(140,160,255,.3) transparent}
.seed{flex:0 0 auto;width:68px;height:66px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:4px 2px;position:relative;transition:border-color .2s,background .2s}
.seed:hover{background:var(--panel2)}
.seed.on{border-color:var(--gold);box-shadow:0 0 14px rgba(255,210,122,.35),inset 0 0 12px rgba(255,210,122,.12)}
.seed.poor .cost{color:var(--bad)}
.seed.locked{opacity:.62}
.seed.locked .orb{filter:grayscale(1) brightness(.6)}
.seed .nm{font-size:11px;line-height:1}
.seed .cost{font-size:10px;color:var(--gold);line-height:1}
.orb{width:24px;height:24px;border-radius:50%;display:block;flex:0 0 auto;font-style:normal;font-size:18px;line-height:24px;text-align:center}
.o-rock{background:radial-gradient(circle at 35% 35%,#e6d6c6,#8a7563 55%,#2b221b)}
.o-moon{width:16px;height:16px;margin:4px;background:radial-gradient(circle at 35% 35%,#f2f2f6,#9a9aa6 60%,#33333b)}
.o-ocean{background:radial-gradient(circle at 35% 35%,#bfe8ff,#2f86d6 55%,#0b2350)}
.o-comet{width:12px;height:12px;margin:6px;background:radial-gradient(circle,#fff,#9fe4ff 60%,#3a7fa8);box-shadow:-10px 6px 10px 2px rgba(150,220,255,.45)}
.o-gas{width:30px;height:30px;margin:-3px;background:repeating-linear-gradient(170deg,#f1c98e 0 4px,#c8894f 4px 7px,#e8b47a 7px 10px);
  box-shadow:inset -6px -6px 10px rgba(0,0,0,.55)}
.o-dwarf{background:radial-gradient(circle,#fff6d8,#ffb057 50%,#d0461e);box-shadow:0 0 14px 3px rgba(255,150,70,.7)}
.o-neutron{width:12px;height:12px;margin:6px;background:radial-gradient(circle,#fff,#bfe0ff);box-shadow:0 0 14px 5px rgba(140,190,255,.85)}
.o-tool{background:none;color:var(--accent)}

#chip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bottomH) + 6px);z-index:5;
  display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:20px;background:var(--panel);
  border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12px;white-space:nowrap}
#chip .pn{font-weight:600}
#chip button{height:26px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;padding:0 10px;font-size:12px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bottomH) + 48px);z-index:4;
  max-width:min(520px,92vw);text-align:center;color:var(--dim);font-size:13px;line-height:1.4;pointer-events:none;
  text-shadow:0 1px 6px #000;transition:opacity .6s}

#objective{position:fixed;left:10px;top:calc(var(--topH) + 6px);z-index:5;width:min(300px,calc(100vw - 20px));padding:10px 12px}
#objective h4{margin:0 0 4px;color:var(--gold);font-size:13px}
#objective p{margin:0 0 6px;font-size:12px;color:var(--dim);line-height:1.35}
.pbar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));width:0;transition:width .3s}
.objRow{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px}

#alert{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--topH) + 6px);z-index:6;
  max-width:min(460px,94vw);padding:8px 14px;border-radius:14px;background:rgba(40,8,30,.85);border:1px solid rgba(255,92,122,.5);
  box-shadow:0 0 24px rgba(160,40,120,.45);font-size:12px;line-height:1.35;text-align:center}
#alert b{color:var(--bad);font-size:14px}
#alert.heal{background:rgba(8,40,30,.85);border-color:rgba(125,255,176,.5);box-shadow:0 0 24px rgba(60,200,140,.4)}
#alert.heal b{color:var(--good)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tip{position:fixed;z-index:8;pointer-events:none;max-width:260px;padding:10px 12px;font-size:12px;line-height:1.4;
  background:rgba(10,13,32,.92);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#tip .tn{font-size:15px;font-weight:700}
#tip .tp{font-weight:600}
#tip .ts{color:var(--dim)}
#tip .td{margin:4px 0;color:#cfd5ff}
#tip .cb{height:4px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
#tip .cb i{display:block;height:100%}

#toasts{position:fixed;right:10px;top:calc(var(--topH) + 8px);z-index:9;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;width:min(340px,94vw)}
.toast{padding:7px 12px;border-radius:12px;font-size:12px!important;background:rgba(14,18,42,.92);border:1px solid var(--line);font-size:13px;
  text-align:center;animation:tin .35s ease-out;transition:opacity .5s,transform .5s;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.toast.gold{border-color:rgba(255,210,122,.55)}
.toast.bad{border-color:rgba(255,92,122,.6)}
.toast.good{border-color:rgba(125,255,176,.55)}
.toast.poem{border-color:rgba(200,160,255,.6);font-style:italic}
.toast.out{opacity:0;transform:translateY(8px)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}}

/* ===================== Модальные окна ===================== */
.modalWrap{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(ellipse at center,rgba(10,12,35,.55),rgba(2,3,10,.88));animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 22px 18px;border-radius:22px;
  background:linear-gradient(160deg,rgba(26,30,70,.96),rgba(10,12,32,.97));border:1px solid rgba(150,170,255,.28);
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 60px rgba(110,90,255,.15)}
.modal h1{margin:0;font-size:30px;font-weight:300;letter-spacing:.04em;text-align:center;
  background:linear-gradient(90deg,#ffd27a,#ff9ad5,#8fb4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.modal h2{margin:0 0 10px;font-size:20px;font-weight:500;color:var(--gold)}
.modal h3{margin:14px 0 6px;font-size:14px;color:var(--accent)}
.modal p,.modal li{line-height:1.5;color:#d3d8ff}
.modal .sub{text-align:center;color:var(--dim);margin:6px 0 18px}
.mbtns{display:flex;flex-direction:column;gap:8px}
.mb{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;
  text-align:left;display:flex;align-items:center;gap:12px;transition:background .2s,border-color .2s}
.mb:hover{background:rgba(255,255,255,.09);border-color:rgba(170,190,255,.45)}
.mb .ic{font-size:22px;width:30px;text-align:center;color:var(--gold)}
.mb small{display:block;color:var(--dim);font-size:12px}
.mb.danger{border-color:rgba(255,92,122,.4)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row .mb{flex:1 1 140px;justify-content:center;text-align:center;padding:10px}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;justify-content:center}
.tg button{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font-size:12px}
.tg button.on{border-color:var(--good);color:var(--good)}
.upg,.chl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);margin-bottom:8px}
.upg .info,.chl .info{flex:1}
.upg .info b,.chl .info b{display:block}
.upg .info small,.chl .info small{color:var(--dim);font-size:12px;line-height:1.35;display:block}
.lv{display:flex;gap:3px;margin-top:4px}
.lv i{width:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.lv i.f{background:var(--gold)}
.chl.done{border-color:rgba(125,255,176,.4)}
.chl .ok{color:var(--good);font-size:18px}
ul.story{list-style:none;padding:0;margin:10px 0}
ul.story li{padding:4px 0 4px 10px;border-left:2px solid rgba(150,170,255,.25);margin-bottom:4px;font-size:13px}
ul.story .t{color:var(--gold);font-variant-numeric:tabular-nums;font-size:11px;margin-right:6px}
.end{font-style:italic;color:#f0c8e0!important}
.stats{color:var(--dim)!important;font-size:12px}
kbd{background:rgba(255,255,255,.1);border-radius:4px;padding:0 5px;font-size:12px}

/* ===================== Галактика ===================== */
#galTop{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(180deg,rgba(4,5,13,.9),rgba(4,5,13,0))}
.galTitle{font-size:18px;font-weight:300;letter-spacing:.05em}
.galTitle small{display:block;font-size:12px;color:var(--gold);letter-spacing:0}
#galTop .btns{margin-left:auto}
#galCard{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));
  width:min(400px,calc(100vw - 20px));padding:14px 16px}
#galCard h3{margin:0 0 2px;font-size:17px}
#galCard .st{font-size:12px;color:var(--dim);margin-bottom:6px}
#galCard .pc{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;margin:6px 0}
#galCard ul{margin:4px 0 8px;padding-left:18px;font-size:12px;color:#cfd5ff}
#galCard .row{margin-top:8px}
#galLegend{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:4;font-size:11px;color:var(--dim);max-width:260px;line-height:1.4}
body.gal #top,body.gal #bottom,body.gal #chip,body.gal #objective,body.gal #alert,body.gal #hint{display:none!important}
body:not(.gal) #galTop,body:not(.gal) #galCard,body:not(.gal) #galLegend{display:none!important}

/* ===================== Адаптив под телефон ===================== */
@media (max-width:760px){
  .ib .lbl{display:none}
  .title{max-width:140px}
  .title #gName{font-size:13px}
  .stab{order:10;flex:1 1 100%}
  .btns{gap:4px}
  .ib{height:34px;min-width:34px;padding:0 8px;border-radius:10px}
  .seed{width:58px;height:58px}
  .dust{min-width:70px;padding:3px 8px}
  .dust b{font-size:15px}
  #bUpg .lbl{display:none}
  #galLegend{display:none!important}
  #toasts{right:auto;left:50%;transform:translateX(-50%);align-items:center;top:auto;bottom:calc(var(--bottomH) + 46px);flex-direction:column-reverse}
  #objective{top:auto;bottom:calc(var(--bottomH) + 44px);left:8px;width:min(250px,60vw);padding:8px 10px}
}
@media (max-width:520px){ #bShot{display:none} }
@media (max-width:420px){ .time{min-width:40px;font-size:12px} .title{max-width:110px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- Верхняя панель: режим, стабильность, время, кнопки -->
<div id="top" class="bar">
  <button id="bMenu" class="ib" title="Меню (Esc)">☰</button>
  <div class="title"><span id="modeLbl">Сад</span><span id="gName">…</span></div>
  <div class="stab">
    <div class="stabLbl"><span>Стабильность</span><b id="stabPct">100%</b></div>
    <div class="stabBar"><div id="stabFill"></div></div>
  </div>
  <div class="time" title="Возраст системы">⏱ <span id="tLbl">0:00</span></div>
  <div class="btns">
    <button id="bPause" class="ib" title="Пауза (пробел)">⏸</button>
    <button id="bSpeed" class="ib" title="Скорость времени">1×</button>
    <button id="bReset" class="ib" title="Сброс">⟲</button>
    <button id="bConserve" class="ib" title="Законсервировать сад">❄<span class="lbl">&nbsp;Консервация</span><i class="prog" id="consProg"></i></button>
    <button id="bShot" class="ib" title="Снимок сада">📷</button>
    <button id="bGalaxy" class="ib" title="Карта галактики (G)">✷<span class="lbl">&nbsp;Галактика</span></button>
  </div>
</div>

<div id="objective" class="panel hidden"></div>
<div id="alert" class="hidden"></div>
<div id="hint" class="hidden"></div>
<div id="chip" class="hidden"></div>

<!-- Нижняя панель: пыль, инструменты, семена, улучшения -->
<div id="bottom" class="bar">
  <div class="dust" title="Звёздная пыль"><b id="dustLbl">0</b><small id="dustRate">✦ +0/с</small></div>
  <div id="seeds" class="seeds"></div>
  <button id="bUpg" class="ib" title="Улучшения">⬆<span class="lbl">&nbsp;Улучшения</span></button>
</div>

<!-- Галактика садов -->
<div id="galTop">
  <div class="galTitle">✷ Галактика садов<small id="galRate"></small></div>
  <div class="btns">
    <button id="bNewGarden" class="ib">🌱<span class="lbl">&nbsp;Новый сад</span></button>
    <button id="bGalBack" class="ib">↩<span class="lbl">&nbsp;Назад</span></button>
  </div>
</div>
<div id="galCard" class="panel hidden"></div>
<div id="galLegend">Каждая звезда — законсервированный сад. Сильные сады притягивают слабых и подпитывают их, редкие сочетания характеров дают бонусы к пыли.</div>

<div id="tip" class="hidden"></div>
<div id="toasts"></div>
<div id="modal" class="modalWrap hidden"><div class="modal" id="modalBox"></div></div>

<script>
'use strict';
/* =====================================================================
   ГРАВИТАЦИОННЫЙ САД
   Один файл, без библиотек. Структура скрипта:
   1. Утилиты и справочники (типы тел, характеры, улучшения, испытания)
   2. Сохранение (localStorage)
   3. Звук и музыка (Web Audio API)
   4. Физика: N тел, слияния, осколки, анализ орбит и стабильности
   5. Характеры, болезнь, пыль, консервация
   6. Режимы, испытания, галактика
   7. Отрисовка
   8. Интерфейс и ввод, главный цикл
   ===================================================================== */

// ======================= 1. УТИЛИТЫ =======================
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const mod = (v, m) => ((v % m) + m) % m;
const uid = () => Math.random().toString(36).slice(2, 10);
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const fmtTime = s => { s = Math.max(0, Math.floor(s)); const m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); };
const fmt = n => n >= 10000 ? (n / 1000).toFixed(1) + 'k' : n >= 100 ? String(Math.floor(n)) : n >= 10 ? n.toFixed(0) : n.toFixed(1);

// Генератор имён миров из мягких слогов
const SYL_A = ['Ли', 'Ве', 'Та', 'Мо', 'Эй', 'Ор', 'Са', 'Ни', 'Ка', 'Зе', 'Ми', 'Ал', 'Ру', 'Ио', 'Фе', 'Ла', 'Не', 'Ю', 'Ва', 'Си', 'Ар', 'Эл', 'Ти', 'Да', 'Ин', 'Ус', 'Ам'];
const SYL_B = ['ра', 'ле', 'ни', 'ми', 'ва', 'та', 'ри', 'на', 'со', 'ли', 'ме', 'ла', 'ве', 'ро', 'ну', 'ди', 'ке', 'са'];
const SYL_C = ['я', 'на', 'ра', 'ис', 'ия', 'эль', 'он', 'а', 'ар', 'ея', 'ина', 'ос', 'ан', '', ''];
function genName(plain) {
  let n = pick(SYL_A) + pick(SYL_B);
  if (Math.random() < 0.65) n += pick(SYL_C);
  if (!plain && Math.random() < 0.1) n += ' ' + pick(['II', 'III', 'Малая', 'Старшая', 'Прима']);
  return n;
}

// Типы тел. g — грамматический род (для историй), dust — базовая выработка пыли

const SAVE_KEY = 'gravGarden.v1';
function defaultSave() {
  return {
    v: 1, dust: 40, unlocked: { rock: true, moon: true }, upg: {}, gardens: [], activeId: null, sandbox: null,
    chDone: {}, nextPers: rollPers(), lastSeen: Date.now(), hintDone: false, seenIntro: false,
    ach: {}, stats: { planted: 0, poems: 0 }, seenVersion: null,
    settings: { music: true, sfx: true, trails: true, names: true, sandboxDisease: true, orbits: true, cosmic: true },
  };
}
function loadSave() {
  const d = defaultSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const o = JSON.parse(raw);
      return Object.assign(d, o, { settings: Object.assign(d.settings, o.settings || {}), stats: Object.assign(d.stats, o.stats || {}), ach: o.ach || {} });
    }
  } catch (e) { console.warn('Не удалось загрузить сохранение', e); }
  return d;
}
let S = loadSave();

const R3 = v => Math.round(v * 1000) / 1000;

function unlockAch(id) {
  if (S.ach[id] || Game.mode === 'sandbox') return;
  const a = ACH.find(x => x.id === id); if (!a) return;
  S.ach[id] = Date.now(); S.dust += a.r;
  toast(`🏆 Достижение: <b>${a.name}</b>${a.r ? ' · +' + a.r + ' ✦' : ''}`, 'gold');
  Audio.unlock();
}
// Превращает живой мир в компактный объект для localStorage
function serializeWorld(w) {
  return {
    id: w.id, name: w.name, age: R3(w.age), stableTime: R3(w.stableTime), chaosTime: R3(w.chaosTime),
    events: w.events, conserved: w.conserved, dead: w.dead, shock: R3(w.shock), stab: R3(w.stab),
    rateAvg: R3(w.rateAvg), nextId: w.nextId, maxBodies: w.maxBodies, dustEarned: R3(w.dustEarned), created: w.created,
    bodies: w.bodies.map(b => ({ id: b.id, type: b.type, name: b.name, pers: b.pers, x: R3(b.x), y: R3(b.y), vx: R3(b.vx), vy: R3(b.vy), m: R3(b.m), born: R3(b.born), seed: R3(b.seed), tilt: R3(b.tilt), rings: b.rings || 0, ab: b.absorbed || 0 })),
    particles: w.particles.slice(0, 300).map(p => [R3(p.x), R3(p.y), R3(p.vx), R3(p.vy), R3(p.m)]),
    disease: w.disease ? Object.assign({}, w.disease) : null,
  };
}
function save() {
  try {
    if (W) {
      if (Game.mode === 'garden' && Game.gardenRef) { Game.gardenRef.state = serializeWorld(W); summarize(Game.gardenRef, W); }
      if (Game.mode === 'sandbox') S.sandbox = serializeWorld(W);

}

// ======================= 3. ЗВУК И МУЗЫКА =======================
const D3 = 146.83;
const semi = s => D3 * Math.pow(2, s / 12);
const PENTA = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24, 27, 29, 31];      // ре-минорная пентатоника
const CHORDS = [[0, 7, 14, 17], [-4, 3, 10, 14], [-7, 0, 7, 12], [-2, 5, 12, 15]];
const CHORDS_DARK = [[0, 1, 7, 13], [-5, 1, 6, 12], [-3, 3, 4, 10]];

const Audio = {
  ctx: null, master: null, music: null, sfx: null, nextChord: 0, nextBell: 0, ci: 0, droneG: null, lastNote: 0, lastDust: 0, lastMerge: 0, dark: false,
  // Аудиоконтекст создаётся по первому жесту пользователя
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = 0.85;
    const comp = c.createDynamicsCompressor();
    this.master.connect(comp); comp.connect(c.destination);
    // Реверберация из синтезированного шума — «космическое» пространство
    const rev = c.createConvolver(); rev.buffer = this.impulse(3.8);
    const revG = c.createGain(); revG.gain.value = 0.6;
    rev.connect(revG); revG.connect(this.master);
    this.music = c.createGain(); this.sfx = c.createGain();
    this.music.connect(this.master); this.music.connect(rev);
    this.sfx.connect(this.master); this.sfx.connect(rev);
    this.music.gain.value = 0; this.sfx.gain.value = 0;
    // Низкий гул болезни
    this.droneG = c.createGain(); this.droneG.gain.value = 0;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180;
    for (const f of [55, 58.3, 82.4]) { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(); }
    lp.connect(this.droneG); this.droneG.connect(this.master);
    this.nextChord = c.currentTime + 0.3; this.nextBell = c.currentTime + 2;
    this.apply();
  },
  impulse(sec) {
    const c = this.ctx, len = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    return b;
  },
  apply() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.music.gain.setTargetAtTime(S.settings.music ? 0.32 : 0, t, 0.4);
    this.sfx.gain.setTargetAtTime(S.settings.sfx ? 0.55 : 0, t, 0.1);
  },
  // Простой тон с огибающей
  tone(f, dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    if (o.detune) osc.detune.value = o.detune;
    const g = c.createGain(); const v = o.vol ?? 0.2, a = o.attack ?? 0.01;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.dest || this.sfx);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  bell(f, vol = 0.1, delay = 0, dest) {
    this.tone(f, 2.4, { vol, attack: 0.006, delay, dest });
    this.tone(f * 2.01, 1.3, { vol: vol * 0.3, delay, dest });
    this.tone(f * 3.003, 0.7, { vol: vol * 0.12, delay, dest });
  },
  noise(dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + (o.delay || 0);
    const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = o.ftype || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f0 || 800, t); f.frequency.exponentialRampToValueAtTime(o.f1 || 800, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + (o.attack || 0.02));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.sfx); src.start(t); src.stop(t + dur + 0.05);
  },
  // Музыка: медленные аккорды-пэды и редкие колокольчики
  updateMusic() {
    const c = this.ctx; if (!c || !S.settings.music) return;
    const t = c.currentTime;
    if (t >= this.nextChord - 0.2) {
      const set = this.dark ? CHORDS_DARK : CHORDS;
      const ch = set[this.ci++ % set.length];
      const t0 = Math.max(t, this.nextChord);
      for (const s of ch) for (const det of [-7, 7]) {
        const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = semi(s); o.detune.value = det;
        const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = this.dark ? 500 : 850;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.045, t0 + 3);
        g.gain.setValueAtTime(0.045, t0 + 7); g.gain.linearRampToValueAtTime(0.0001, t0 + 11);
        o.connect(lp); lp.connect(g); g.connect(this.music); o.start(t0); o.stop(t0 + 11.2);
      }
      this.nextChord = t0 + 8;
    }
    if (t >= this.nextBell) {
      this.bell(semi(pick(PENTA) + 12), 0.03, 0, this.music);
      this.nextBell = t + rand(2, 5.5);
    }
  },
  setDrone(on) { if (this.ctx) this.droneG.gain.setTargetAtTime(on && S.settings.sfx ? 0.05 : 0, this.ctx.currentTime, 0.8); this.dark = on; },
  // Звуковые эффекты
  click() { this.tone(880, 0.08, { vol: 0.05 }); },
  place() { this.bell(semi(17), 0.1); this.tone(semi(24), 0.3, { vol: 0.05, delay: 0.06 }); },
  launch() { this.noise(0.5, { f0: 300, f1: 1800, vol: 0.08, q: 2 }); },
  merge() { const t = performance.now(); if (t - this.lastMerge < 120) return; this.lastMerge = t; this.tone(220, 1.6, { vol: 0.18, slide: 165 }); this.bell(semi(12), 0.06, 0.05); },
  shatter() { this.noise(0.9, { ftype: 'lowpass', f0: 1800, f1: 120, vol: 0.32 }); this.tone(110, 0.9, { type: 'triangle', vol: 0.15, slide: 50 }); },
  dust() { const t = performance.now(); if (t - this.lastDust < 140) return; this.lastDust = t; this.tone(semi(pick([36, 39, 41, 43])), 0.18, { vol: 0.018 }); },
  note(idx) { const t = performance.now(); if (t - this.lastNote < 180) return; this.lastNote = t; this.bell(semi(PENTA[clamp(idx, 0, PENTA.length - 1)] + 12), 0.035, 0, this.music); },
  quirk() { this.tone(660, 0.25, { type: 'triangle', vol: 0.05, slide: 990 }); },
  arpeggio(up = true, vol = 0.08) { const n = [0, 3, 7, 10, 12, 15, 19]; n.forEach((s, i) => this.bell(semi((up ? s : 19 - s) + 12), vol, i * 0.12)); },
  sick() { this.tone(110, 3, { type: 'sawtooth', vol: 0.08, slide: 52, attack: 0.5 }); this.noise(2.5, { ftype: 'lowpass', f0: 400, f1: 60, vol: 0.1, attack: 0.6 }); },
  cure() { this.arpeggio(true, 0.1); this.noise(1.5, { f0: 2000, f1: 6000, vol: 0.04 }); },
  death() { [19, 15, 12, 7, 3, 0].forEach((s, i) => this.tone(semi(s), 2.2, { type: 'triangle', vol: 0.09, delay: i * 0.35 })); this.noise(3, { ftype: 'lowpass', f0: 600, f1: 40, vol: 0.15, attack: 1 }); },
  conserve() { [0, 7, 12, 16, 19, 24].forEach((s, i) => this.bell(semi(s + 12), 0.08, i * 0.09)); this.noise(2.4, { f0: 3000, f1: 9000, vol: 0.05, attack: 0.8 }); },
  unlock() { [12, 19, 24].forEach((s, i) => this.bell(semi(s), 0.09, i * 0.1)); },
  bad() { this.tone(180, 0.25, { type: 'triangle', vol: 0.07, slide: 140 }); },
};

// ======================= 4. ФИЗИКА =======================
const G = 800;             // гравитационная постоянная в игровых единицах
const EPS2 = 9;            // смягчение (ε²), чтобы силы не уходили в бесконечность
const DT = 1 / 120;        // фиксированный шаг симуляции
const MAX_STEPS = 48;      // предел шагов за кадр (защита от «спирали смерти»)
const LAUNCH_K = 0.6;      // перевод длины перетаскивания в скорость
const WORLD_LIMIT = 5000;  // дальше — тело потеряно в пустоте
const MAX_PARTICLES = 450; // предел астероидов
const GENTLE_R = 220, GENTLE_K = 0.12;   // радиус и сила ласковой стабилизации
const SHY_R = 40, SHY_K = 35;            // радиус и сила застенчивого бегства
const CURE_R = 200, STARVE_R = 230;      // зоны лечения и «голода» болезни
const CONSERVE_TIME = 60;                // секунд стабильности для консервации

let W = null; // текущий мир
const Game = { mode: 'garden', view: 'garden', paused: false, speed: 1, modal: false, gardenRef: null, transition: null, realT: 0, saveT: 0, prevMode: 'garden' };
const lvl = k => Game.mode === 'sandbox' ? UPGRADES[k].max : (S.upg[k] || 0);

function newWorld(o = {}) {
  return {
    id: o.id || uid(), name: o.name || ('Сад ' + genName(true)), bodies: [], particles: [], disease: null, pending: [],
    age: 0, stableTime: 0, chaosTime: 0, events: [], conserved: false, dead: false, cured: false,
    shock: 0, stab: 1, stabShow: 1, rate: 0, rateAvg: 0, structAcc: 0, nextId: 1, glintAcc: 0, auroraT: 0,
    nebulae: [], maxBodies: 0, dustEarned: 0, stepCount: 0, chal: null, created: o.created || Date.now(), map: new Map(), planets: 0,
  };
}
const radiusFor = b => TYPES[b.type].r * Math.cbrt(b.m / TYPES[b.type].m);
function bodyColor(b) {
  const c = TYPES[b.type].col;
  if (!b.pers) return c.slice();
  const p = PERS[b.pers].rgb;
  return [Math.round(lerp(c[0], p[0], 0.32)), Math.round(lerp(c[1], p[1], 0.32)), Math.round(lerp(c[2], p[2], 0.32))];
}
function makeBody(w, type, x, y, vx, vy, o = {}) {
  const T = TYPES[type];
  const b = {
    id: w.nextId++, type, x, y, vx, vy, ax: 0, ay: 0, m: o.m ?? T.m, r: 0,
    name: o.name ?? (type === 'sun' ? 'Сердце сада' : genName()),
    pers: o.pers ?? null, born: w.age, seed: o.seed ?? rand(1000), tilt: o.tilt ?? rand(TAU),
    capT: rand(6, 14), poeT: rand(18, 40), chaos: 0, switchShock: 0, primary: null, P: null, hill: Infinity,
    e: 0, a: 0, T: Infinity, bound: true, trail: [], lx: -0.7, ly: -0.7, starD: 1e9, flash: 0, dead: false, calm: false,
  };
  b.r = radiusFor(b); b.col = bodyColor(b);
  return b;
}
function refreshBody(b) { b.r = radiusFor(b); b.col = bodyColor(b); }

// Ускорения всех тел и астероидов (частиц). Частицы чувствуют тела, но не притягивают их.
function computeAcc() {
  const B = W.bodies, n = B.length, D = W.disease;
  for (let i = 0; i < n; i++) { B[i].ax = 0; B[i].ay = 0; B[i].shyNear = false; }
  for (let i = 0; i < n; i++) {
    const a = B[i];
    for (let j = i + 1; j < n; j++) {
      const b = B[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy + EPS2;
      const inv = G / (d2 * Math.sqrt(d2));
      let fa = b.m * inv, fb = a.m * inv;
      // Жадная планета тянет мелочь сильнее
      if (b.pers === 'greedy' && a.m < 6) fa *= 2.5;
      if (a.pers === 'greedy' && b.m < 6) fb *= 2.5;
      a.ax += dx * fa; a.ay += dy * fa; b.ax -= dx * fb; b.ay -= dy * fb;
    }
  }
  // Застенчивые планеты отталкиваются от близких небольших тел
  for (const s of B) {
    if (s.pers !== 'shy') continue;
    for (const o of B) {
      if (o === s || o.m >= 60 || o.primary === s.id || s.primary === o.id) continue; // своих спутников и свою планету не боится
      const dx = s.x - o.x, dy = s.y - o.y, d = Math.hypot(dx, dy) || 1, R = SHY_R + s.r + o.r;
      if (d < R) { const k = SHY_K * (1 - d / R); s.ax += dx / d * k; s.ay += dy / d * k; s.shyNear = true; }
    }
  }
  // Болезнь — неподвижная тёмная масса
  if (D) for (const b of B) {
    const dx = D.x - b.x, dy = D.y - b.y, d2 = dx * dx + dy * dy + 64, inv = G * D.m / (d2 * Math.sqrt(d2));
    b.ax += dx * inv; b.ay += dy * inv;
  }
  // Астероиды
  for (const p of W.particles) {
    let ax = 0, ay = 0;
    for (const b of B) {
      const dx = b.x - p.x, dy = b.y - p.y, d2r = dx * dx + dy * dy;
      if (d2r < b.r * b.r) { p.eat = b; break; }
      const d2 = d2r + EPS2, inv = G * b.m / (d2 * Math.sqrt(d2)) * (b.pers === 'greedy' ? 2.5 : 1);
      ax += dx * inv; ay += dy * inv;
    }
    if (D) {
      const dx = D.x - p.x, dy = D.y - p.y, d2 = dx * dx + dy * dy + 64;
      if (d2 < D.rh * D.rh) p.eatenByHole = true;
      const inv = G * D.m / (d2 * Math.sqrt(d2)); ax += dx * inv; ay += dy * inv;
    }
    p.ax = ax; p.ay = ay;
  }
}

// Один шаг «скачущей лягушки» (leapfrog): kick-drift-kick, энергия хорошо сохраняется
function stepWorld(dt) {
  const B = W.bodies, P = W.particles, h = dt * 0.5;
  for (const b of B) { b.vx += b.ax * h; b.vy += b.ay * h; b.x += b.vx * dt; b.y += b.vy * dt; }
  for (const p of P) { p.vx += p.ax * h; p.vy += p.ay * h; p.x += p.vx * dt; p.y += p.vy * dt; }
  computeAcc();
  for (const b of B) { b.vx += b.ax * h; b.vy += b.ay * h; }
  for (const p of P) { p.vx += p.ax * h; p.vy += p.ay * h; }
  collisions();
  W.stepCount++;
  if (W.stepCount % 4 === 0) {
    for (const b of W.bodies) {
      b.trail.push(b.x, b.y);
      const max = b.type === 'comet' ? 180 : isStar(b) ? 60 : 120;
      if (b.trail.length > max) b.trail.splice(0, 2);
    }
  }
}

function collisions() {
  const B = W.bodies;
  let changed = false;
  for (let i = 0; i < B.length; i++) {
    const a = B[i]; if (a.dead) continue;
    for (let j = i + 1; j < B.length; j++) {
      const b = B[j]; if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
      if (dx * dx + dy * dy < rr * rr) { collide(a, b); changed = true; if (a.dead) break; }
    }
  }
  // Болезнь поглощает тела
  const D = W.disease;
  if (D) for (const b of B) {
    if (b.dead) continue;
    if (Math.hypot(b.x - D.x, b.y - D.y) < D.rh + b.r * 0.4) {
      b.dead = true; changed = true;
      D.m += b.m * (isStar(b) ? 0.15 : 0.5); D.rh = holeR(D.m); D.eaten.push(b.name);
      fxRing(b.x, b.y, b.r, b.r * 6, [190, 80, 255], 1.2, 3); fxSparks(b.x, b.y, 18, [200, 90, 255], 50, 1.2);
      Audio.shatter();
      if (b.type === 'sun') { logEv(`Тьма коснулась Сердца сада.`, 'death'); gardenDeath('heart'); }
      else { logEv(`Болезнь поглотила ${b.name} — ${descOf(b)}.`, 'eaten'); toast(`☠ Болезнь поглотила ${b.name}`, 'bad'); }
    }
  }
  // Улетевшие в пустоту
  for (const b of B) {
    if (!b.dead && (b.x * b.x + b.y * b.y) > WORLD_LIMIT * WORLD_LIMIT) {
      b.dead = true; changed = true;
      if (b.type !== 'shard') { logEv(`${b.name} ${vf(b, 'ушла', 'ушёл', 'ушло')} в межзвёздную тьму и ${vf(b, 'не вернулась', 'не вернулся', 'не вернулось')}.`, 'lost'); toast(`${b.name} ${vf(b, 'улетела', 'улетел', 'улетело')} в пустоту`); }
    }
  }
  if (changed) W.bodies = B.filter(b => !b.dead);
  if (W.pending.length) { W.bodies.push(...W.pending); W.pending.length = 0; changed = true; }
  // Астероиды: поглощение телами и болезнью, вылет за пределы
  let pchg = false;
  for (const p of W.particles) {
    if (p.eat && !p.eat.dead) {
      const e = p.eat; e.m += p.m; e.r = radiusFor(e); p.dead = true; pchg = true;
      e.absorbed = (e.absorbed || 0) + 1;
      // Планета, собравшая много астероидов, обретает кольца
      if (isPlanet(e) && !e.rings && e.absorbed >= 12) {
        e.rings = 1; unlockAch('rings');
        logEv(`Вокруг ${e.name} из пойманных астероидов сложились кольца.`, 'grow');
        toast(`💫 ${e.name} ${vf(e, 'обрела', 'обрёл')} кольца`, 'gold');
        fxRing(e.x, e.y, e.r, e.r * 4, [230, 210, 170], 1.4, 2);
      }
    }
    else if (p.eatenByHole && W.disease) { W.disease.m += p.m * 0.5; p.dead = true; pchg = true; }
    else if (p.x * p.x + p.y * p.y > 3500 * 3500) { p.dead = true; pchg = true; }
    p.eat = null; p.eatenByHole = false;
  }
  if (pchg) W.particles = W.particles.filter(p => !p.dead);
  if (changed) { computeAcc(); W.maxBodies = Math.max(W.maxBodies, W.bodies.length); }
}

// Столкновение: мягкое — слияние, сильное — осколки и астероидный пояс
function collide(a, b) {
  const big = a.m >= b.m ? a : b, small = big === a ? b : a;
  const vrel = Math.hypot(a.vx - b.vx, a.vy - b.vy);
  const vesc = Math.sqrt(2 * G * (a.m + b.m) / (a.r + b.r));
  const soft = 1 + 0.35 * lvl('soft');
  if (isStar(big) || small.m < 0.4 || vrel < vesc * 1.15 * soft) merge(big, small);
  else shatter(big, small, vrel);
}

function merge(big, small) {
  const M = big.m + small.m;
  big.vx = (big.vx * big.m + small.vx * small.m) / M; big.vy = (big.vy * big.m + small.vy * small.m) / M;
  big.x = (big.x * big.m + small.x * small.m) / M; big.y = (big.y * big.m + small.y * small.m) / M;
  big.m = M; small.dead = true; big.flash = 1;
  const oldType = big.type;
  // Рост: камень → гигант → звезда
  if ((big.type === 'moon' || big.type === 'shard') && M >= 2) big.type = 'rock';
  if ((big.type === 'rock' || big.type === 'ocean') && M >= 20) big.type = 'gas';
  if (big.type === 'gas' && M >= 220) big.type = 'dwarf';
  if (big.type === 'rock' && !big.pers) { big.pers = rollPers(); }
  if (isStar(big) && !TYPES[oldType].star) big.pers = null;
  refreshBody(big);
  W.shock += small.m > 0.5 ? 0.05 : 0.01;
  fxRing(big.x, big.y, big.r, big.r * 3.5, big.col, 0.9, 2);
  if (small.m >= 0.5 || W.bodies.length < 30) Audio.merge();
  if (small.m >= 0.5 && small.type !== 'shard') unlockAch('merge');
  if (big.type === 'gas' && oldType !== 'gas') unlockAch('giant');
  if (isStar(big) && !TYPES[oldType].star) { unlockAch('star'); W.starBorn = true;
    logEv(`Набрав массу, ${big.name} ${vf(big, 'вспыхнула', 'вспыхнул')} и стала звездой-карликом! В саду родилось новое солнце.`, 'star');
    toast(`✺ Рождение звезды: ${big.name}!`, 'gold'); fxRing(big.x, big.y, big.r, big.r * 12, [255, 200, 120], 2.5, 4); Audio.conserve();
  } else if (big.type !== oldType && big.type === 'gas') {
    logEv(`${big.name} ${vf(big, 'разрослась', 'разросся')} до газового гиганта.`, 'grow'); toast(`${big.name} теперь газовый гигант`, 'gold');
  } else if (small.type === 'comet' && big.type === 'ocean') {
    logEv(`Комета ${small.name} упала в океаны ${big.name} и принесла им свежую воду.`, 'merge');
  } else if (isStar(big) && small.m >= 0.5) {
    const where = big.type === 'sun' ? 'Сердце сада' : 'звезду ' + big.name;
    logEv(`${small.name} ${vf(small, 'упала', 'упал')} в ${where} и ${vf(small, 'сгорела', 'сгорел')}.`, 'merge'); if (small.type !== 'shard') toast(`${small.name} ${vf(small, 'сгорела', 'сгорел')}: ${where}`, 'bad');
  } else if (small.m >= 0.5) {
    logEv(`${small.name} и ${big.name} мягко слились в один мир — ${big.name}.`, 'merge'); if (small.type !== 'shard') toast(`Слияние: ${small.name} + ${big.name}`);
  }
}

function shatter(big, small, vrel) {
  const cx = (big.x * big.m + small.x * small.m) / (big.m + small.m), cy = (big.y * big.m + small.y * small.m) / (big.m + small.m);
  const cvx = (big.vx * big.m + small.vx * small.m) / (big.m + small.m), cvy = (big.vy * big.m + small.vy * small.m) / (big.m + small.m);
  let debris;
  if (small.m > big.m * 0.4) {
    // Сопоставимые массы: оба мира раскалываются, остаётся ядро
    const M = big.m + small.m;
    big.m = M * 0.55; big.x = cx; big.y = cy; big.vx = cvx; big.vy = cvy; debris = M * 0.45;
  } else {
    const nm = big.m + small.m * 0.4;
    big.vx = (big.vx * big.m + small.vx * small.m * 0.4) / nm; big.vy = (big.vy * big.m + small.vy * small.m * 0.4) / nm;
    big.m = nm; debris = small.m * 0.6;
  }
  if (big.type === 'gas' && big.m < 20) big.type = 'rock';
  small.dead = true; refreshBody(big); big.flash = 1;
  W.shock += 0.25;
  // Крупные осколки
  const nFrag = Math.min(4, Math.floor(debris / 0.7));
  const fragM = nFrag ? debris * 0.6 / nFrag : 0;
  const a0 = rand(TAU);
  for (let k = 0; k < nFrag; k++) {
    const ang = a0 + k * TAU / nFrag + rand(-0.3, 0.3);
    const tmp = { type: 'shard', m: fragM }; const fr = radiusFor(tmp);
    const dd = big.r + fr + 3 + rand(3), sp = vrel * rand(0.2, 0.45);
    const f = makeBody(W, 'shard', big.x + Math.cos(ang) * dd, big.y + Math.sin(ang) * dd, cvx + Math.cos(ang) * sp, cvy + Math.sin(ang) * sp, { m: fragM, name: `${small.name}-${k + 1}` });
    W.pending.push(f);
  }
  // Пыль и астероиды
  const rest = nFrag ? debris * 0.4 : debris;
  const cnt = Math.min(MAX_PARTICLES - W.particles.length, clamp(Math.round(debris * 12), 12, 50));
  for (let k = 0; k < cnt; k++) {
    const ang = rand(TAU), dd = big.r + 2 + rand(6), sp = vrel * rand(0.08, 0.55);
    W.particles.push({ x: big.x + Math.cos(ang) * dd, y: big.y + Math.sin(ang) * dd, vx: cvx + Math.cos(ang) * sp, vy: cvy + Math.sin(ang) * sp, ax: 0, ay: 0, m: rest / Math.max(1, cnt), tw: rand(TAU) });
  }
  fxRing(big.x, big.y, big.r, big.r * 7, [255, 190, 140], 1.1, 3);
  fxSparks(big.x, big.y, 30, [255, 200, 150], vrel * 0.6, 1.2);
  Audio.shatter();
  unlockAch('shatter');
  logEv(`Удар! ${small.name} ${vf(small, 'врезалась', 'врезался')} в ${big.name} и ${vf(small, 'раскололась', 'раскололся')} на осколки. Вокруг закружился астероидный пояс.`, 'shatter');
  if (small.type !== 'shard') toast(`💥 ${small.name} ${vf(small, 'разбилась', 'разбился')} о ${big.name}`, 'bad');
}

// Барицентр «главного» тела вместе с тяжёлыми спутниками внутри орбиты (для двойных звёзд и т. п.)
function orbitCenter(P, exclude, refDist) {
  let M = P.m, cx = P.x * P.m, cy = P.y * P.m, vx = P.vx * P.m, vy = P.vy * P.m;
  for (const q of W.bodies) {
    if (q === P || q === exclude || q.P !== P || q.m < 0.05 * P.m) continue;
    if (Math.hypot(q.x - P.x, q.y - P.y) < 0.6 * refDist) { M += q.m; cx += q.x * q.m; cy += q.y * q.m; vx += q.vx * q.m; vy += q.vy * q.m; }
  }
  return { M, x: cx / M, y: cy / M, vx: vx / M, vy: vy / M };
}
// Самое «локальное» притягивающее тело для точки (по сферам Хилла)
function localAttractor(x, y, m) {
  let best = null, bestH = Infinity, heavy = null;
  for (const b of W.bodies) {
    if (!heavy || b.m > heavy.m) heavy = b;
    if (b.m < m * 3) continue;
    const d = Math.hypot(x - b.x, y - b.y), H = b.hill ?? Infinity;
    if (d < H * 0.85 && H < bestH) { best = b; bestH = H; }
  }
  return best || heavy;
}
// Скорость круговой орбиты вокруг притягивающего тела (против часовой стрелки в координатах мира)
function circularVelocity(x, y, m, att, factor = 1) {
  if (!att) return [0, 0];
  const d0 = Math.hypot(x - att.x, y - att.y) || 1;
  const c = orbitCenter(att, null, d0);
  const dx = x - c.x, dy = y - c.y, d = Math.hypot(dx, dy) || 1;
  const greed = att.pers === 'greedy' && m < 6 ? 2.5 : 1;   // жадная планета тянет мелочь сильнее
  const v = Math.sqrt(G * (c.M * greed + m) / d) * factor;
  return [c.vx + (-dy / d) * v, c.vy + (dx / d) * v, c];
}

// Анализ структуры системы: кто вокруг кого вращается, эксцентриситеты, хаос, стабильность
function analyze(dt) {
  const B = W.bodies;
  W.map = new Map(); for (const b of B) { W.map.set(b.id, b); b.calm = false; }
  W.planets = B.filter(isPlanet).length;
  if (!B.length) { W.stab = clamp(1 - W.shock, 0, 1); return; }
  const sorted = B.slice().sort((a, b) => b.m - a.m);
  const top = sorted[0]; top.hill = Infinity; top.P = null; top.primary = null; top.chaos *= 0.9; top.bound = true; top.e = 0;
  for (let i = 1; i < sorted.length; i++) {
    const b = sorted[i]; let best = top, bestH = Infinity;
    for (let k = 1; k < i; k++) {
      const c = sorted[k]; if (c.m < b.m) continue;
      const d = Math.hypot(b.x - c.x, b.y - c.y);
      if (d < c.hill * 0.95 && c.hill < bestH) { best = c; bestH = c.hill; }
    }
    b.P = best;
    b.hill = Math.hypot(b.x - best.x, b.y - best.y) * Math.cbrt(b.m / (3 * best.m));
  }
  // Орбитальные элементы
  for (const b of B) {
    if (b === top) continue;
    const P = b.P;
    if (b.primary !== null && b.primary !== P.id && W.age - b.born > 1.5) b.switchShock = 1;
    b.primary = P.id;
    const dP = Math.hypot(b.x - P.x, b.y - P.y);
    const c = orbitCenter(P, b, dP);
    const mu = G * (c.M * (P.pers === 'greedy' && b.m < 6 ? 2.5 : 1) + b.m);
    const rx = b.x - c.x, ry = b.y - c.y, vx = b.vx - c.vx, vy = b.vy - c.vy;
    const r = Math.hypot(rx, ry) || 1, v2 = vx * vx + vy * vy;
    const en = v2 / 2 - mu / r, h = rx * vy - ry * vx;
    b.e = Math.sqrt(Math.max(0, 1 + 2 * en * h * h / (mu * mu)));
    b.bound = en < 0; b.a = b.bound ? -mu / (2 * en) : Infinity;
    b.T = b.bound ? TAU * Math.sqrt(b.a * b.a * b.a / mu) : Infinity;
    const rv = rx * vx + ry * vy, k1 = v2 - mu / r;
    b.evx = (k1 * rx - rv * vx) / mu; b.evy = (k1 * ry - rv * vy) / mu; b.ocdx = c.x - P.x; b.ocdy = c.y - P.y;
    b.mu = mu; b.ocx = c.x; b.ocy = c.y; b.ocvx = c.vx; b.ocvy = c.vy; b.hdir = h >= 0 ? 1 : -1; b.orbR = r;
    // «Музыка сфер»: нота при прохождении планетой условной линии
    const ang = Math.atan2(ry, rx);
    if (b.lastAng !== undefined && Math.sign(b.lastAng) !== Math.sign(ang) && rx > 0 && b.bound && b.type !== 'shard' && Game.view === 'garden')
      Audio.note(Math.round(13 - Math.log2(Math.max(20, r)) * 1.6));
    b.lastAng = ang;
  }
  // Направление света от ближайшей яркой звезды
  const stars = B.filter(isStar);
  for (const b of B) {
    if (isStar(b)) continue;
    let best = null, bs = 0;
    for (const s of stars) { const d2 = (s.x - b.x) ** 2 + (s.y - b.y) ** 2 + 1; if (s.m / d2 > bs) { bs = s.m / d2; best = s; } }
    if (best) { const d = Math.hypot(best.x - b.x, best.y - b.y) || 1; b.lx = (best.x - b.x) / d; b.ly = (best.y - b.y) / d; b.starD = d; }
  }
  // Ласковые планеты: мягко скругляют орбиты соседей
  for (const g of B) {
    if (g.pers !== 'gentle') continue;
    for (const b of B) {
      if (b === top || isStar(b) || !b.mu) continue;
      const d = Math.hypot(b.x - g.x, b.y - g.y); if (d > GENTLE_R) continue;
      if (b !== g) { b.calm = true; b.calmBy = g.id; }
      const f = (b === g ? 0.5 : 1) * (1 - d / GENTLE_R) * GENTLE_K * dt;
      const rx = b.x - b.ocx, ry = b.y - b.ocy, r = Math.hypot(rx, ry) || 1, vc = Math.sqrt(b.mu / r);
      const tx = -ry / r * b.hdir, ty = rx / r * b.hdir;
      b.vx += (b.ocvx + tx * vc - b.vx) * f; b.vy += (b.ocvy + ty * vc - b.vy) * f;
    }
  }
  // Хаос каждого тела и общая стабильность
  const anchor = 1 - 0.1 * lvl('anchor');
  let sum = 0, wsum = 0;
  for (const b of B) {
    if (b === top) continue;
    const tol = b.type === 'comet' ? 0.6 : 0.25;
    const ce = !b.bound ? 1 : clamp((b.e - tol) / 0.45, 0, 1);
    let inst = Math.max(ce, b.switchShock);
    b.switchShock *= Math.exp(-dt / 2.5);
    if (b.calm) inst *= 0.55;
    if (b.pers === 'gentle') inst *= 0.8;
    inst *= anchor;
    b.chaos += (inst - b.chaos) * (1 - Math.exp(-dt / 1.5));
    const w = b.type === 'rogue' ? 0 : b.type === 'shard' ? 0.4 : b.type === 'comet' ? 0.6 : 1;
    sum += b.chaos * w; wsum += w;
  }
  W.stab = clamp(1 - (wsum ? sum / wsum : 0) - W.shock, 0, 1);
}

// Предсказание траектории (упрощённая копия системы)
const predTime = () => 3.2 * (1 + 0.5 * lvl('sight'));
function predictPath(px, py, pvx, pvy, pm, pr, skipId) {
  const src = W.bodies.filter(b => b.id !== skipId && b.m >= 0.5);
  const n = src.length, N = n + 1, dt = 1 / 60;
  const X = new Float64Array(N), Y = new Float64Array(N), VX = new Float64Array(N), VY = new Float64Array(N);
  const AX = new Float64Array(N), AY = new Float64Array(N), M = new Float64Array(N), R = new Float64Array(N);
  for (let i = 0; i < n; i++) { const b = src[i]; X[i] = b.x; Y[i] = b.y; VX[i] = b.vx; VY[i] = b.vy; M[i] = b.m; R[i] = b.r; }
  const GR = src.map(b => b.pers === 'greedy' && pm < 6 ? 2.5 : 1); GR.push(1);
  X[n] = px; Y[n] = py; VX[n] = pvx; VY[n] = pvy; M[n] = pm; R[n] = pr;
  const D = W.disease;
  const acc = () => {
    AX.fill(0); AY.fill(0);
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const dx = X[j] - X[i], dy = Y[j] - Y[i], d2 = dx * dx + dy * dy + EPS2, inv = G / (d2 * Math.sqrt(d2));
      AX[i] += dx * inv * M[j] * (i === n ? GR[j] : 1); AY[i] += dy * inv * M[j] * (i === n ? GR[j] : 1);
      AX[j] -= dx * inv * M[i] * (j === n ? GR[i] : 1); AY[j] -= dy * inv * M[i] * (j === n ? GR[i] : 1);
    }
    if (D) for (let i = 0; i < N; i++) { const dx = D.x - X[i], dy = D.y - Y[i], d2 = dx * dx + dy * dy + 64, inv = G * D.m / (d2 * Math.sqrt(d2)); AX[i] += dx * inv; AY[i] += dy * inv; }
  };
  acc();
  const steps = Math.round(predTime() / dt), pts = [px, py]; let hit = null;
  for (let s = 0; s < steps; s++) {
    for (let i = 0; i < N; i++) { VX[i] += AX[i] * dt / 2; VY[i] += AY[i] * dt / 2; X[i] += VX[i] * dt; Y[i] += VY[i] * dt; }
    acc();
    for (let i = 0; i < N; i++) { VX[i] += AX[i] * dt / 2; VY[i] += AY[i] * dt / 2; }
    if (s % 2 === 1) pts.push(X[n], Y[n]);
    for (let i = 0; i < n; i++) { const dx = X[n] - X[i], dy = Y[n] - Y[i], rr = R[n] + R[i]; if (dx * dx + dy * dy < rr * rr) { hit = { x: X[n], y: Y[n] }; break; } }
    if (!hit && D && Math.hypot(X[n] - D.x, Y[n] - D.y) < D.rh) hit = { x: X[n], y: Y[n] };
    if (hit) { pts.push(hit.x, hit.y); break; }
  }
  return { pts, hit };
}

// ======================= 5. ХАРАКТЕРЫ, ПЫЛЬ, БОЛЕЗНЬ =======================
function logEv(text, k = 'info') {
  if (!W) return;
  W.events.push({ t: Math.round(W.age), k, text });
  if (W.events.length > 90) W.events.splice(6, 1);
}
function addDust(n) { if (Game.mode === 'sandbox' && Game.view === 'garden') return; S.dust += n; }

// Выработка пыли: только если система стабильна (≥ 50%)
function dustRate() {
  if (!W || W.stab < 0.5) return 0;
  const f = (W.stab - 0.5) / 0.5;
  let sum = 0, n = 0;
  for (const b of W.bodies) {
    const base = TYPES[b.type].dust; if (!base) continue;
    sum += base * (b.pers ? PERS[b.pers].dust : 1) * (1 - b.chaos * 0.7); n++;
  }
  return sum * f * (1 + 0.25 * lvl('lens')) * (W.auroraT > 0 ? 2 : 1) * (1 + 0.04 * Math.min(n, 15));
}

// Продвижение «медленной» логики мира (раз в кадр, на накопленное время симуляции)
function tickWorld(dt) {
  if (dt <= 0 || !W || W.dead) return;
  W.age += dt;
  W.structAcc += dt;
  if (W.structAcc >= 0.2) { analyze(W.structAcc); W.structAcc = 0; }
  for (const b of W.bodies) {
    if (b.flash > 0) b.flash = Math.max(0, b.flash - dt * 1.5);
    if (b.pers === 'capricious') { b.capT -= dt; if (b.capT <= 0) { capriciousKick(b); b.capT = rand(7, 15); } }
    if (b.pers === 'poetic') { b.poeT -= dt; if (b.poeT <= 0) { poeticEvent(b); b.poeT = rand(28, 55); } }
    if (b.aurora > 0) b.aurora -= dt;
  }
  W.shock = Math.max(0, W.shock - dt * 0.12);
  W.achT = (W.achT || 0) - dt;
  if (W.achT <= 0 && Game.mode !== 'sandbox') {
    W.achT = 1;
    const ps = new Set(W.bodies.map(b => b.pers).filter(Boolean)); if (ps.size >= 5) unlockAch('choir');
    if (W.bodies.some(b => b.P && isPlanet(b.P) && b.bound && !isStar(b) && b.e < 0.5)) unlockAch('moon');
    if (S.dust >= 1000) unlockAch('rich');
  }
  cosmicTick(dt);
  W.auroraT = Math.max(0, W.auroraT - dt);
  for (const n of W.nebulae) n.t -= dt;
  W.nebulae = W.nebulae.filter(n => n.t > 0);
  W.stabShow = lerp(W.stabShow, W.stab, 1 - Math.exp(-dt * 3));
  // Пыль
  W.rate = dustRate();
  W.rateAvg += (W.rate - W.rateAvg) * (1 - Math.exp(-dt / 12));
  if (Game.mode === 'garden') {
    addDust(W.rate * dt); W.dustEarned += W.rate * dt;
    W.glintAcc += W.rate * dt;
    if (W.glintAcc >= 1) {
      W.glintAcc -= 1;
      const src = W.bodies.filter(b => TYPES[b.type].dust > 0);
      if (src.length) { const b = pick(src); FX.push({ k: 'glint', x: b.x, y: b.y, vx: rand(-8, 8), vy: rand(-20, -8), life: 1.6, max: 1.6 }); Audio.dust(); }
    }
  }
  // Время непрерывной стабильности (для консервации)
  if (W.stab >= 0.7 && W.planets >= 3) W.stableTime += dt; else W.stableTime = Math.max(0, W.stableTime - dt * 3);
  diseaseTick(dt);
  if (Game.mode === 'challenge') challengeTick(dt);
}

// Капризная планета сама чуть меняет орбиту
function capriciousKick(b) {
  const sp = Math.hypot(b.vx - (b.ocvx || 0), b.vy - (b.ocvy || 0));
  const dv = sp * rand(0.03, 0.07), a = rand(TAU);
  b.vx += Math.cos(a) * dv; b.vy += Math.sin(a) * dv; b.flash = 0.6;
  fxSparks(b.x, b.y, 10, PERS.capricious.rgb, 30, 0.8);
  Audio.quirk();
  if (!b.kicked || Math.random() < 0.12) { b.kicked = true; logEv(`${b.name} ${vf(b, 'капризно сменила', 'капризно сменил')} орбиту — просто потому что захотелось.`, 'quirk'); }
}

// Поэтичная планета открывает редкие события
function poeticEvent(b) {
  const garden = Game.mode === 'garden';
  const roll = Math.random();
  if (roll < 0.28) {
    for (let i = 0; i < 28; i++) FX.push({ k: 'meteor', sx: rand(VW * 0.2, VW * 1.2), sy: rand(-80, VH * 0.4), vx: rand(-420, -260), vy: rand(200, 320), life: rand(0.6, 1.4), max: 1.4, delay: rand(0, 2.5) });
    Audio.arpeggio(false, 0.05);
    if (garden) addDust(10);
    logEv(`Над ${b.name} пролился звездопад. Кто-то загадал желание.`, 'poem');
    toast(`✧ Звездопад над ${b.name}${garden ? ' · +10 ✦' : ''}`, 'poem');
  } else if (roll < 0.52) {
    W.auroraT = 12; b.aurora = 12;
    logEv(`${b.name} ${vf(b, 'окуталась', 'окутался')} северным сиянием, и весь сад засветился мягким светом.`, 'poem');
    toast(`🌌 Сияние над ${b.name}: пыль ×2 на 12 с`, 'poem'); Audio.arpeggio(true, 0.05);
  } else if (roll < 0.72) {
    const ps = W.bodies.filter(x => x.type !== 'shard' && x.type !== 'sun');
    ps.forEach((p, i) => { setTimeout(() => { p.flash = 1; Audio.bell(semi(PENTA[i % PENTA.length] + 12), 0.06); }, i * 160); });
    const bonus = 15 + 5 * ps.length;
    if (garden) addDust(bonus);
    logEv(`${b.name} ${vf(b, 'запела', 'запел')}, и миры сада ответили ей — «песня сфер».`, 'poem');
    toast(`♪ Песня сфер${garden ? ' · +' + bonus + ' ✦' : ''}`, 'poem');
  } else if (roll < 0.86) {
    const heavy = W.bodies.reduce((a, c) => (!a || c.m > a.m) ? c : a, null);
    if (heavy) {
      const ang = rand(TAU), R = 850, x = heavy.x + Math.cos(ang) * R, y = heavy.y + Math.sin(ang) * R;
      const [vx, vy] = circularVelocity(x, y, 0.3, heavy, 0.5);
      const c = makeBody(W, 'comet', x, y, vx, vy, { name: 'Странница ' + genName() });
      W.bodies.push(c); computeAcc();
      logEv(`Из глубин пришла комета ${c.name}, привлечённая стихами ${b.name}.`, 'poem');
      toast(`☄ Редкая гостья: ${c.name}`, 'poem'); Audio.arpeggio(true, 0.04);
    }
  } else {
    W.nebulae.push({ x: b.x, y: b.y, hue: rand(180, 330), t: 22, max: 22 });
    logEv(`Вокруг ${b.name} расцвела цветная туманность.`, 'poem');
    toast(`❁ Туманность расцвела у ${b.name}`, 'poem'); Audio.arpeggio(true, 0.04);
  }
  fxRing(b.x, b.y, b.r, b.r * 8, [220, 200, 255], 1.6, 2);
  if (Game.mode !== 'sandbox') { S.stats.poems++; if (S.stats.poems >= 5) unlockAch('muse'); }
}

// ---------- Космические события ----------
const COSMIC = {
  rogue:   { name: 'Блуждающая звезда', icon: '☄', warn: 'К саду приближается блуждающая звезда — она раскачает орбиты.' },
  meteors: { name: 'Метеоритный дождь', icon: '☄', warn: 'Из глубин летит метеоритный дождь.' },
  flare:   { name: 'Солнечная вспышка', icon: '✺', warn: 'Сердце сада готовится вспыхнуть: будет пыль, но ближние миры качнёт.' },
};
const heaviest = () => W.bodies.reduce((a, c) => (!a || c.m > a.m) ? c : a, null);
const cosmicOn = () => (Game.mode === 'garden' && S.settings.cosmic) || (Game.mode === 'challenge' && W.chal.def.goal.kind === 'storm');
function cosmicTick(dt) {
  // Блуждающая звезда уходит своей дорогой
  let gone = false;
  for (const b of W.bodies) if (b.type === 'rogue' && Math.hypot(b.x, b.y) > 2200 && b.x * b.vx + b.y * b.vy > 0) {
    b.dead = true; gone = true; W.rogueGone = true;
    logEv(`Блуждающая звезда ${b.name} ушла дальше своей дорогой.`, 'cosmic');
  }
  if (gone) { W.bodies = W.bodies.filter(b => !b.dead); computeAcc(); }
  if (!cosmicOn()) return;
  const C = W.cosmic;
  if (C) {
    C.t -= dt;
    if (C.phase === 'warn' && C.t <= 0) { triggerCosmic(C.kind); C.phase = 'active'; C.t = 35; }
    else if (C.phase === 'active' && C.t <= 0) {
      if (W.planets >= C.planets0 && !W.dead) {
        unlockAch('storm');
        logEv(`Сад выдержал испытание «${COSMIC[C.kind].name}» без единой потери.`, 'cosmic');
        toast(`✓ Сад пережил «${COSMIC[C.kind].name}» без потерь`, 'good');
      }
      W.cosmic = null; W.cosmicT = rand(150, 260);
    }
    return;
  }
  if (Game.mode !== 'garden' || W.disease || W.planets < 3) return;
  if (W.cosmicT == null) W.cosmicT = rand(90, 160);
  W.cosmicT -= dt;
  if (W.cosmicT <= 0) startCosmic(pick(Object.keys(COSMIC)));
}
function startCosmic(kind, warn = 8) {
  const h = heaviest();
  if (kind === 'flare' && !(h && isStar(h))) kind = 'rogue';
  W.cosmic = { kind, phase: 'warn', t: warn, planets0: W.planets };
  toast(`⚠ ${COSMIC[kind].warn}`, 'bad'); Audio.bad();
}
function triggerCosmic(kind) {
  const h = heaviest(), cx = h ? h.x : 0, cy = h ? h.y : 0;
  W.cosmic.planets0 = W.planets;
  if (kind === 'rogue') {
    const a = rand(TAU), R = 1500, x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
    const off = rand(320, 480) * (Math.random() < 0.5 ? 1 : -1);
    const tx = cx - Math.sin(a) * off, ty = cy + Math.cos(a) * off, d = Math.hypot(tx - x, ty - y), sp = rand(130, 170);
    const r = makeBody(W, 'rogue', x, y, (tx - x) / d * sp, (ty - y) / d * sp, { name: 'Странница ' + genName(true) });
    W.bodies.push(r); computeAcc();
    logEv(`Сквозь сад прошла блуждающая звезда ${r.name}, раскачивая орбиты.`, 'cosmic');
    toast(`☄ ${r.name} входит в сад`, 'bad');
  } else if (kind === 'meteors') {
    const a = rand(TAU), dx = Math.cos(a), dy = Math.sin(a), R = 1100;
    for (let i = 0; i < 45 && W.particles.length < MAX_PARTICLES; i++) {
      const side = rand(-260, 260), along = rand(0, 260), sp = rand(160, 230);
      W.particles.push({ x: cx + dx * (R + along) - dy * side, y: cy + dy * (R + along) + dx * side, vx: -dx * sp + rand(-15, 15), vy: -dy * sp + rand(-15, 15), ax: 0, ay: 0, m: 0.08, tw: rand(TAU) });
    }
    logEv('На сад обрушился метеоритный дождь.', 'cosmic');
    toast('☄ Метеоритный дождь!', 'bad');
  } else if (kind === 'flare') {
    for (const b of W.bodies) {
      if (b === h) continue;
      const ddx = b.x - cx, ddy = b.y - cy, d = Math.hypot(ddx, ddy) || 1;
      if (d < 450) { const k = 9 * (1 - d / 450); b.vx += ddx / d * k; b.vy += ddy / d * k; b.flash = 0.8; }
    }
    W.shock += 0.12;
    fxRing(cx, cy, 30, 650, [255, 200, 120], 2.2, 5); fxRing(cx, cy, 20, 400, [255, 240, 200], 1.5, 3);
    const bonus = 25 + 5 * W.planets;
    if (Game.mode === 'garden') addDust(bonus);
    logEv('Сердце сада вспыхнуло: волна света качнула ближние орбиты и осыпала сад пылью.', 'cosmic');
    toast(`✺ Солнечная вспышка${Game.mode === 'garden' ? ' · +' + bonus + ' ✦' : ''}`, 'gold');
  }
  Audio.sick();
}

// ---------- Болезнь системы ----------
const holeR = m => 5 + Math.sqrt(m) * 0.9;
const diseaseOn = () => Game.mode !== 'sandbox' || S.settings.sandboxDisease;
function diseaseTick(dt) {
  const D = W.disease;
  if (!D) {
    if (!diseaseOn()) { W.chaosTime = 0; return; }
    const countable = W.bodies.filter(b => b.P).length;
    if (W.stab < 0.45 && countable >= 2) W.chaosTime += dt; else W.chaosTime = Math.max(0, W.chaosTime - dt * 0.5);
    if (W.chaosTime > 25 + 10 * lvl('immune')) spawnDisease();
    return;
  }
  D.age += dt;
  const healers = W.bodies.filter(b => (b.pers === 'gentle' || b.type === 'dwarf') && Math.hypot(b.x - D.x, b.y - D.y) < CURE_R);
  const near = W.bodies.some(b => b.type !== 'sun' && Math.hypot(b.x - D.x, b.y - D.y) < STARVE_R);
  D.healers = healers.length; D.starving = !healers.length && !near && W.stab >= 0.55;
  if (healers.length) D.cure += dt * 0.11 * Math.min(3, healers.length);
  else if (D.starving) D.cure += dt * 0.06;
  else { D.cure = Math.max(0, D.cure - dt * 0.03); D.timer -= dt; }
  D.m += dt * (healers.length ? -8 : D.starving ? -3 : (3 + 9 * (1 - W.stab)));
  D.m = Math.max(12, D.m); D.rh = holeR(D.m);
  if (D.cure >= 1) cureDisease();
  else if (D.timer <= 0) { logEv('Никто не успел исцелить рану.', 'death'); gardenDeath('timer'); }
}
function spawnDisease(pos) {
  let x = 0, y = 0, w = 0;
  if (pos) { x = pos.x; y = pos.y; }
  else {
    for (const b of W.bodies) if (b.chaos > 0.4) { x += b.x * b.chaos; y += b.y * b.chaos; w += b.chaos; }
    if (w) { x /= w; y /= w; } else { const a = rand(TAU); x = Math.cos(a) * 300; y = Math.sin(a) * 300; }
    x += rand(-40, 40); y += rand(-40, 40);
    const heavy = W.bodies.reduce((a, c) => (!a || c.m > a.m) ? c : a, null);
    if (heavy) { const dx = x - heavy.x, dy = y - heavy.y, d = Math.hypot(dx, dy) || 1; if (d < 260) { x = heavy.x + dx / d * 260; y = heavy.y + dy / d * 260; } }
  }
  W.disease = { x, y, m: 30, rh: holeR(30), cure: 0, timer: 90 + 20 * lvl('immune'), age: 0, eaten: [], healers: 0, starving: false };
  W.chaosTime = 0;

function galaxySpot() {

      const [vx, vy] = circularVelocity(x, y, 3, sun, rand(0.6, 0.75));

function findResonance(target, tol) {
  const ps = W.bodies.filter(b => isPlanet(b) && b.bound && b.P && isStar(b.P) && isFinite(b.T) && b.e < 0.4);
  for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {
    const r = Math.max(ps[i].T, ps[j].T) / Math.min(ps[i].T, ps[j].T);
    if (Math.abs(r - target) / target < tol) return [ps[i], ps[j]];
  }
  return null;
}
function challengeTick(dt) {
  const C = W.chal; if (C.done) return;
  const g = C.def.goal; let ok = false;
  switch (g.kind) {
    case 'stable': ok = W.stab >= 0.7 && W.planets >= g.planets; break;
    case 'res': C.pair = findResonance(g.ratio, 0.06); ok = W.stab >= 0.55 && !!C.pair; break;
    case 'moon': ok = W.bodies.some(b => b.P && isPlanet(b.P) && b.bound && b.e < 0.5 && !isStar(b)); break;
    case 'binary': ok = W.bodies.filter(isStar).length >= 2 && W.planets >= 1 && W.stab >= 0.65; break;
    case 'belt': ok = W.particles.length >= g.n && W.stab >= 0.5; break;
    case 'comet': ok = W.bodies.some(b => b.type === 'comet' && b.bound && b.e >= 0.7 && b.P && isStar(b.P)); break;
    case 'storm': ok = !!W.rogueGone && W.planets >= 3 && W.stab >= 0.6; break;
    case 'mass': C.best = W.bodies.reduce((m, b) => isStar(b) ? m : Math.max(m, b.m), 0); if (C.best >= g.n) challengeComplete(); return;
    case 'cure': return;
  }
  C.ok = ok;
  if (ok) C.progress += dt; else C.progress = Math.max(0, C.progress - dt * 1.5);
  if (C.progress >= g.secs) challengeComplete();
}

// ---------- Галактика: бонусы соседей и пассивная пыль ----------
const GAL_R = 170;
const PAIR_BONUS = {
  'gentle|gentle': [0.2, 'Созвездие нежности'], 'poetic|poetic': [0.4, 'Резонанс муз'], 'gentle|greedy': [0.25, 'Притяжение противоположностей'],
  'capricious|poetic': [0.3, 'Вдохновенный хаос'], 'poetic|shy': [0.25, 'Тихие стихи'], 'capricious|shy': [0.15, 'Танец нервов'], 'greedy|greedy': [0.15, 'Союз голодных'],
};
let galCache = null, galCacheT = 0;
function galaxyBonuses(force) {
  if (!force && galCache && Game.realT - galCacheT < 1) return galCache;
  const res = {}, links = [];
  const gs = S.gardens.filter(g => g.conserved && !g.dead);
  for (const g of gs) {
    const r = res[g.id] = { mult: 1, notes: [] };
    const pc = g.persCounts || {}, has = k => (pc[k] || 0) > 0;
    const add = (v, t) => { r.mult += v; r.notes.push(`${t} +${Math.round(v * 100)}%`); };
    if (PERS_KEYS.every(has)) add(1, 'Полный хор характеров');
    else {
      if (has('gentle') && has('shy')) add(0.3, 'Тихая гавань');
      if (has('capricious') && has('gentle')) add(0.25, 'Буря и штиль');
      if (has('greedy') && has('poetic')) add(0.35, 'Голодная муза');
      if (has('greedy') && has('shy')) add(0.2, 'Пугливый пир');
    }
  }
  for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++) {
    const a = gs[i], b = gs[j], d = Math.hypot(a.gx - b.gx, a.gy - b.gy);
    if (d > GAL_R) continue;
    const strong = a.strength >= b.strength ? a : b, weak = strong === a ? b : a;
    const ratio = strong.strength / Math.max(0.1, weak.strength);
    const link = { a: strong, b: weak, pull: ratio > 1.2, d };
    if (link.pull) { const v = clamp(0.1 * ratio, 0.1, 0.5); res[weak.id].mult += v; res[weak.id].notes.push(`Притяжение «${strong.name}» +${Math.round(v * 100)}%`); }
    if (a.dominant && b.dominant) {
      const pb = PAIR_BONUS[[a.dominant, b.dominant].sort().join('|')];
      if (pb) { for (const g of [a, b]) { res[g.id].mult += pb[0]; res[g.id].notes.push(`${pb[1]} с «${(g === a ? b : a).name}» +${Math.round(pb[0] * 100)}%`); } link.combo = pb[1]; }
    }
    links.push(link);
  }
  // Созвездие: у сада не меньше двух соседей-звёзд
  for (const g of gs) {
    const n = gs.filter(o => o !== g && Math.hypot(o.gx - g.gx, o.gy - g.gy) < GAL_R).length;
    if (n >= 2) { res[g.id].mult += 0.2; res[g.id].notes.push(`Созвездие из ${n + 1} садов +20%`); }
  }
  galCache = { res, links }; galCacheT = Game.realT;
  return galCache;
}
function passiveRate() {
  const { res } = galaxyBonuses();
  let sum = 0;
  for (const g of S.gardens) {
    if (!g.conserved || g.dead) continue;
    if (Game.mode === 'garden' && Game.view === 'garden' && Game.gardenRef && g.id === Game.gardenRef.id) continue;
    sum += g.strength * 0.3 * (res[g.id] ? res[g.id].mult : 1);
  }
  return sum;
}
// Пассивная пыль идёт в реальном времени; слабые сады медленно дрейфуют к сильным
function passiveTick(rdt) {
  const r = passiveRate();
  if (r > 0) S.dust += r * rdt;
  const { links } = galaxyBonuses();
  for (const l of links) if (l.pull && l.d > 60) {
    const dx = l.a.gx - l.b.gx, dy = l.a.gy - l.b.gy, d = Math.hypot(dx, dy) || 1;
    l.b.gx += dx / d * 1.2 * rdt; l.b.gy += dy / d * 1.2 * rdt;
  }
}
